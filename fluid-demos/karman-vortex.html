<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カルマン渦列 — 格子ボルツマン法 (D2Q9)</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0b0e14;color:#cdd6e4;font-family:system-ui,-apple-system,sans-serif;
       display:flex;flex-direction:column;align-items:center;min-height:100vh}
  h1{font-size:15px;font-weight:600;margin:14px 0 4px;letter-spacing:.06em;color:#e2e8f4}
  #bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center;
       padding:8px 14px;background:#121826;border:1px solid #1f2937;border-radius:10px;margin:8px;font-size:12px}
  label{display:flex;align-items:center;gap:6px;white-space:nowrap;color:#9fb0ca}
  input[type=range]{width:86px;accent-color:#f97316}
  select,button{background:#1c2434;color:#cdd6e4;border:1px solid #2a3650;border-radius:6px;
       padding:3px 10px;font-size:12px;cursor:pointer}
  button:hover{background:#273248}
  #stats{font-variant-numeric:tabular-nums;color:#7dd3fc;min-width:150px;text-align:right}
  canvas{border-radius:8px;box-shadow:0 8px 40px #000a;touch-action:none;cursor:crosshair;
       max-width:96vw;height:auto}
  #hint{font-size:11px;color:#5b6b85;margin:8px}
</style>
</head>
<body>
<h1>カルマン渦列 — 格子ボルツマン法 (D2Q9)</h1>
<div id="bar">
  <label>流速 <input type="range" id="u0" min="0.03" max="0.13" step="0.005" value="0.10"></label>
  <label>粘性 <input type="range" id="nu" min="0" max="1" step="0.01" value="0.38"></label>
  <label>半径 <input type="range" id="rad" min="6" max="20" step="1" value="10"></label>
  <label>形状 <select id="shape">
    <option value="circle">円柱</option><option value="square">角柱</option>
    <option value="plate">平板</option><option value="tri">三角</option>
  </select></label>
  <label>ステップ/フレーム <input type="range" id="steps" min="1" max="6" step="1" value="3"></label>
  <label><input type="checkbox" id="pchk" checked> 粒子</label>
  <button id="resetFlow">流れリセット</button>
  <button id="resetBar">障害物リセット</button>
  <button id="pause">一時停止</button>
  <span id="stats">Re=— / — fps</span>
</div>
<canvas id="cv" width="1200" height="480"></canvas>
<div id="hint">ドラッグで障害物を描く / Shift+ドラッグで消す</div>

<script>
'use strict';
// ===== CONFIG =====
const NX=400, NY=160, SCALE=3, NC=NX*NY, NP=4000;
const ex=[0,1,0,-1,0,1,-1,-1,1];
const ey=[0,0,1,0,-1,1,1,-1,-1];
const wq=[4/9,1/9,1/9,1/9,1/9,1/36,1/36,1/36,1/36];
const opp=[0,3,4,1,2,7,8,5,6];
const mir=[0,1,4,3,2,8,7,6,5];  // 上下滑り壁用: ey を反転した方向

let f=new Float32Array(9*NC), f2=new Float32Array(9*NC);
const rho=new Float32Array(NC), ux=new Float32Array(NC), uy=new Float32Array(NC);
const barrier=new Uint8Array(NC);
const feqIn=new Float64Array(9);

const P={u0:0.10, nu:0.02, radius:10, shape:'circle', steps:3, particles:true};
let paused=false;

function feq(i,r,vx,vy){
  const eu=3*(ex[i]*vx+ey[i]*vy);
  return wq[i]*r*(1+eu+0.5*eu*eu-1.5*(vx*vx+vy*vy));
}
function updateInflow(){ for(let i=0;i<9;i++) feqIn[i]=feq(i,1,P.u0,0); }

// ===== 障害物 =====
function inShape(dx,dy,r,shape){
  switch(shape){
    case 'square': return Math.abs(dx)<=r*0.9 && Math.abs(dy)<=r*0.9;
    case 'plate':  return Math.abs(dx)<=1.5   && Math.abs(dy)<=r*1.6;
    case 'tri':    return dx>=-r*0.6 && dx<=r && Math.abs(dy)<=(r-dx)*0.55;
    default:       return dx*dx+dy*dy<=r*r;
  }
}
function rebuildBarrier(){
  barrier.fill(0);   // 上下は滑り壁 (stream 内で鏡映反射) — 境界層が出ず渦列が見やすい
  const ox=(NX/5)|0, oy=((NY/2)|0)+1;  // +1: 渦剥離を早める非対称の種
  const r=P.radius;
  for(let y=1;y<NY-1;y++)for(let x=2;x<NX-2;x++)
    if(inShape(x-ox,y-oy,r,P.shape)) barrier[y*NX+x]=1;
}
function resetFlow(){
  const ox=(NX/5)|0, oy=(NY/2)|0;
  for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){
    const k=y*NX+x;
    // 非対称の種: 全体の弱いうねり + 障害物直後への横向きキック (渦剥離を数秒で開始させる)
    const dx=x-ox-30, dy=y-oy;
    const vy0=0.15*P.u0*Math.sin(2*Math.PI*y/NY)
             +0.5*P.u0*Math.exp(-(dx*dx+dy*dy)/400);
    for(let i=0;i<9;i++) f[i*NC+k]=feq(i,1,P.u0,vy0);
  }
  ux.fill(0); uy.fill(0); rho.fill(1);
}

// ===== LBM コア =====
function collide(){
  const om=1/(3*P.nu+0.5);
  for(let y=0;y<NY;y++){
    for(let x=0;x<NX;x++){
      const k=y*NX+x;
      if(barrier[k]) continue;
      let r=0,mx=0,my=0;
      for(let i=0;i<9;i++){const v=f[i*NC+k]; r+=v; mx+=ex[i]*v; my+=ey[i]*v;}
      const vx=mx/r, vy=my/r;
      rho[k]=r; ux[k]=vx; uy[k]=vy;
      const uu=1.5*(vx*vx+vy*vy);
      for(let i=0;i<9;i++){
        const eu=3*(ex[i]*vx+ey[i]*vy);
        const eq=wq[i]*r*(1+eu+0.5*eu*eu-uu);
        f[i*NC+k]+=om*(eq-f[i*NC+k]);
      }
    }
  }
}
function stream(){
  for(let i=0;i<9;i++){
    const off=i*NC, offO=opp[i]*NC, dx=ex[i], dy=ey[i];
    for(let y=0;y<NY;y++){
      const sy=y-dy, row=y*NX;
      // 上下は滑り壁: 域外参照は同じ行の鏡映方向から取る (鏡面反射)
      const slip=(sy<0||sy>=NY);
      const srow=slip?row:sy*NX, offS=slip?mir[i]*NC:off;
      for(let x=0;x<NX;x++){
        const k=row+x;
        if(barrier[k]) continue;
        const sx=x-dx;
        let v;
        if(sx<0)            v=feqIn[i];
        else if(sx>=NX)     v=f[offS+srow+NX-1];
        else if(barrier[srow+sx]) v=f[offO+k];
        else                v=f[offS+srow+sx];
        f2[off+k]=v;
      }
    }
  }
  const t=f; f=f2; f2=t;
}
function boundary(){
  for(let y=0;y<NY;y++){
    const row=y*NX;
    for(let i=0;i<9;i++){
      f[i*NC+row]=feqIn[i];                 // 流入
      f[i*NC+row+NX-1]=f[i*NC+row+NX-2];    // 流出 (勾配ゼロ)
    }
  }
}

// ===== 可視化 =====
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const off=document.createElement('canvas'); off.width=NX; off.height=NY;
const octx=off.getContext('2d');
const img=octx.createImageData(NX,NY);

const LUTN=512, lut=new Uint8Array(LUTN*3);
(function buildLUT(){
  const L=(a,b,t)=>a+(b-a)*t;
  for(let n=0;n<LUTN;n++){
    const t=n/(LUTN-1)*2-1, s=Math.pow(Math.min(1,Math.abs(t)),0.65);
    let r,g,b;
    if(t>=0){
      if(s<0.6){const u=s/0.6; r=L(11,235,u); g=L(14,92,u); b=L(20,30,u);}
      else{const u=(s-0.6)/0.4; r=L(235,255,u); g=L(92,214,u); b=L(30,140,u);}
    }else{
      if(s<0.6){const u=s/0.6; r=L(11,38,u); g=L(14,110,u); b=L(20,235,u);}
      else{const u=(s-0.6)/0.4; r=L(38,150,u); g=L(110,225,u); b=L(235,255,u);}
    }
    lut[n*3]=r; lut[n*3+1]=g; lut[n*3+2]=b;
  }
})();

function render(){
  const d=img.data, gain=4.5/P.u0;
  for(let y=0;y<NY;y++){
    for(let x=0;x<NX;x++){
      const k=y*NX+x, p=k*4;
      if(barrier[k]){ d[p]=90; d[p+1]=98; d[p+2]=112; d[p+3]=255; continue; }
      let c=0;
      if(x>0&&x<NX-1&&y>0&&y<NY-1)
        c=0.5*((uy[k+1]-uy[k-1])-(ux[k+NX]-ux[k-NX]))*gain;
      let n=((c+1)*0.5*(LUTN-1))|0;
      if(n<0)n=0; else if(n>=LUTN)n=LUTN-1;
      d[p]=lut[n*3]; d[p+1]=lut[n*3+1]; d[p+2]=lut[n*3+2]; d[p+3]=255;
    }
  }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(off,0,0,cv.width,cv.height);
}

// ===== トレーサー粒子 =====
const px=new Float32Array(NP), py=new Float32Array(NP);
function respawn(n){ px[n]=1+Math.random()*4; py[n]=1+Math.random()*(NY-2); }
for(let n=0;n<NP;n++){ px[n]=Math.random()*NX; py[n]=1+Math.random()*(NY-2); }

function moveDrawParticles(){
  ctx.strokeStyle='rgba(255,255,255,0.32)';
  ctx.lineWidth=1;
  ctx.beginPath();
  const adv=SCALE*P.steps;
  for(let n=0;n<NP;n++){
    let x=px[n], y=py[n];
    let x0=x|0, y0=y|0;
    if(x0<0)x0=0; else if(x0>NX-2)x0=NX-2;
    if(y0<0)y0=0; else if(y0>NY-2)y0=NY-2;
    const fx=x-x0, fy=y-y0, k=y0*NX+x0;
    const vx=(ux[k]*(1-fx)+ux[k+1]*fx)*(1-fy)+(ux[k+NX]*(1-fx)+ux[k+NX+1]*fx)*fy;
    const vy=(uy[k]*(1-fx)+uy[k+1]*fx)*(1-fy)+(uy[k+NX]*(1-fx)+uy[k+NX+1]*fx)*fy;
    x+=vx*P.steps; y+=vy*P.steps;
    const ki=(y|0)*NX+(x|0);
    if(x>=NX-2||x<0||y<1||y>NY-2||barrier[ki]){ respawn(n); continue; }
    ctx.moveTo((x-vx*P.steps*4)*SCALE,(y-vy*P.steps*4)*SCALE);
    ctx.lineTo(x*SCALE,y*SCALE);
    px[n]=x; py[n]=y;
  }
  ctx.stroke();
}

// ===== マウスで障害物 =====
let drawing=false, erasing=false;
function paint(e){
  const rect=cv.getBoundingClientRect();
  const gx=((e.clientX-rect.left)*cv.width/rect.width/SCALE)|0;
  const gy=((e.clientY-rect.top)*cv.height/rect.height/SCALE)|0;
  const R=3;
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
    if(dx*dx+dy*dy>R*R) continue;
    const x=gx+dx, y=gy+dy;
    if(x<2||x>NX-3||y<1||y>NY-2) continue;
    const k=y*NX+x;
    if(erasing){
      if(barrier[k]){ barrier[k]=0; for(let i=0;i<9;i++) f[i*NC+k]=feq(i,1,0,0); }
    }else barrier[k]=1;
  }
}
cv.addEventListener('pointerdown',e=>{drawing=true;erasing=e.shiftKey;paint(e);cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(drawing)paint(e);});
cv.addEventListener('pointerup',()=>drawing=false);

// ===== UI =====
const $=id=>document.getElementById(id);
const stats=$('stats');
function nuFromSlider(v){ return 0.005*Math.pow(40,v); }  // 0.005〜0.2 (対数)
function showRe(){ stats.textContent=`Re=${(P.u0*2*P.radius/P.nu).toFixed(0)} / ${fpsText}`; }
$('u0').oninput=e=>{P.u0=+e.target.value; updateInflow(); showRe();};
$('nu').oninput=e=>{P.nu=nuFromSlider(+e.target.value); showRe();};
$('rad').oninput=e=>{P.radius=+e.target.value; rebuildBarrier(); showRe();};
$('shape').onchange=e=>{P.shape=e.target.value; rebuildBarrier();};
$('steps').oninput=e=>P.steps=+e.target.value;
$('pchk').onchange=e=>P.particles=e.target.checked;
$('resetFlow').onclick=()=>resetFlow();
$('resetBar').onclick=()=>rebuildBarrier();
$('pause').onclick=e=>{paused=!paused; e.target.textContent=paused?'再開':'一時停止';};
P.nu=nuFromSlider(0.38);

// ===== メインループ =====
let frames=0, lastT=performance.now(), fpsText='— fps';
function frame(){
  if(!paused){
    for(let s=0;s<P.steps;s++){ collide(); stream(); boundary(); }
    render();
    if(P.particles) moveDrawParticles();
  }
  frames++;
  const now=performance.now();
  if(now-lastT>500){
    fpsText=`${(frames*1000/(now-lastT)).toFixed(0)} fps`;
    frames=0; lastT=now; showRe();
  }
  requestAnimationFrame(frame);
}
updateInflow(); rebuildBarrier(); resetFlow(); showRe();
requestAnimationFrame(frame);
</script>
</body>
</html>
