<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Golden Gate — Bay Simulator</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
  #glCanvas { display: block; width: 100%; height: 100%; }
  #ui {
    position: absolute; top: 14px; left: 14px; width: 272px;
    background: rgba(10, 14, 20, 0.74); backdrop-filter: blur(8px);
    border: 1px solid rgba(232, 112, 58, 0.35); border-radius: 10px;
    padding: 14px 16px; color: #dfe6ee; font-family: system-ui, sans-serif;
    font-size: 12.5px; user-select: none; z-index: 10;
  }
  .ui-title { font-weight: 700; letter-spacing: 1.5px; font-size: 13px; color: #f08a52; margin-bottom: 10px; }
  .ui-row { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
  .wbtn, #cometBtn, #whaleBtn {
    flex: 1 1 auto; background: rgba(255,255,255,0.07); color: #cfd8e2;
    border: 1px solid rgba(255,255,255,0.14); border-radius: 6px;
    padding: 5px 6px; font-size: 11.5px; cursor: pointer; font-family: inherit;
  }
  .wbtn:hover, #cometBtn:not(:disabled):hover, #whaleBtn:hover { background: rgba(255,255,255,0.16); }
  .wbtn.active { background: rgba(232, 112, 58, 0.75); color: #fff; border-color: #f08a52; }
  #cometBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  label { display: block; margin-bottom: 8px; }
  label span { float: right; color: #9fb0c3; }
  input[type=range] { width: 100%; accent-color: #e8703a; margin-top: 3px; }
  #status {
    margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.12);
    color: #a8b8ca; font-size: 11.5px; line-height: 1.55;
  }
  #hint { position: absolute; bottom: 10px; left: 14px; color: rgba(220,230,240,0.5);
    font-family: system-ui, sans-serif; font-size: 11px; z-index: 10; }
</style>
</head>
<body>
<canvas id="glCanvas"></canvas>
<div id="ui">
  <div class="ui-title">GOLDEN GATE &middot; BAY SIM</div>
  <div class="ui-row">
    <button class="wbtn active" data-weather="clear">Clear</button>
    <button class="wbtn" data-weather="marine">Marine</button>
    <button class="wbtn" data-weather="overcast">Overcast</button>
    <button class="wbtn" data-weather="storm">Stormy</button>
  </div>
  <label>Fog bank <span id="fogVal">25%</span><input id="fogSlider" type="range" min="0" max="100" value="25"></label>
  <label>Traffic density <span id="trafficVal">55%</span><input id="trafficSlider" type="range" min="0" max="100" value="55"></label>
  <label>Water waves <span id="waveVal">30%</span><input id="waveSlider" type="range" min="0" max="100" value="30"></label>
  <label>Time of day <span id="timeVal">--</span><input id="timeSlider" type="range" min="0" max="1000" value="300"></label>
  <div class="ui-row">
    <button id="cometBtn" disabled title="Available at night">&#9732; Comet</button>
    <button id="whaleBtn">&#128051; Whales</button>
  </div>
  <div id="status"></div>
</div>
<div id="hint">drag: orbit &middot; right-drag: pan &middot; wheel: dolly</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================= helpers ============================= */
function clamp01(v){ return Math.min(1, Math.max(0, v)); }
function clampRange(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }
function smoothstepJs(edge0, edge1, v){
  const t = clamp01((v - edge0) / (edge1 - edge0));
  return t * t * (3 - 2 * t);
}
function lerp(a, b, t){ return a + (b - a) * t; }
function wrapRange(v, lo, hi){
  const span = hi - lo;
  return ((v - lo) % span + span) % span + lo;
}
function hashJs(hx, hz){
  const s = Math.sin(hx * 127.1 + hz * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function valueNoiseJs(nx, nz){
  const xi = Math.floor(nx), zi = Math.floor(nz);
  const xf = nx - xi, zf = nz - zi;
  const su = xf * xf * (3 - 2 * xf), sv = zf * zf * (3 - 2 * zf);
  const c00 = hashJs(xi, zi), c10 = hashJs(xi + 1, zi);
  const c01 = hashJs(xi, zi + 1), c11 = hashJs(xi + 1, zi + 1);
  return c00 + (c10 - c00) * su + (c01 - c00) * sv + (c00 - c10 - c01 + c11) * su * sv;
}
function fbmJs(fx, fz){
  let acc = 0, amp = 0.5, qx = fx, qz = fz;
  for (let oct = 0; oct < 5; oct++){
    acc += valueNoiseJs(qx, qz) * amp;
    qx = qx * 2.03 + 17.3; qz = qz * 2.03 + 9.1;
    amp *= 0.5;
  }
  return acc;
}
function gauss2(dx, dz, radius){
  return Math.exp(-(dx * dx + dz * dz) / (radius * radius));
}

const GLSL_NOISE = `
float ggHash(vec2 hp){ return fract(sin(dot(hp, vec2(127.1, 311.7))) * 43758.5453123); }
float ggNoise(vec2 np){
  vec2 ip = floor(np); vec2 fp = fract(np);
  vec2 sp = fp * fp * (3.0 - 2.0 * fp);
  float n00 = ggHash(ip);
  float n10 = ggHash(ip + vec2(1.0, 0.0));
  float n01 = ggHash(ip + vec2(0.0, 1.0));
  float n11 = ggHash(ip + vec2(1.0, 1.0));
  return mix(mix(n00, n10, sp.x), mix(n01, n11, sp.x), sp.y);
}
float ggFbm(vec2 fp){
  float acc = 0.0; float amp = 0.5; vec2 qq = fp;
  for (int oct = 0; oct < 5; oct++){
    acc += ggNoise(qq) * amp;
    qq = qq * 2.03 + vec2(17.3, 9.1);
    amp *= 0.5;
  }
  return acc;
}`;

/* ==================== renderer / scene / camera ==================== */
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('glCanvas'), antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x9ab4c9, 0.00005);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 20000);
camera.position.set(640, 220, 820);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 60, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 40;
controls.maxDistance = 5200;
controls.maxPolarAngle = 1.545;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================= lights ============================= */
const sunLight = new THREE.DirectionalLight(0xffffff, 2.6);
sunLight.position.set(1000, 800, 400);
scene.add(sunLight);
scene.add(sunLight.target);

const moonLight = new THREE.DirectionalLight(0xb8c8e8, 0.0);
moonLight.position.set(-800, 600, -300);
scene.add(moonLight);
scene.add(moonLight.target);

const hemiLight = new THREE.HemisphereLight(0x87a8cc, 0x3a3630, 0.7);
scene.add(hemiLight);

const ambientLight = new THREE.AmbientLight(0x223344, 0.28);
scene.add(ambientLight);

const flashLight = new THREE.DirectionalLight(0xcdd8ff, 0.0);
flashLight.position.set(400, 900, -600);
scene.add(flashLight);
scene.add(flashLight.target);

const cometLight = new THREE.DirectionalLight(0xffc880, 0.0);
cometLight.position.set(0, 800, 0);
scene.add(cometLight);
scene.add(cometLight.target);

/* ============================= sky dome ============================= */
const skyUniforms = {
  uTime:        { value: 0 },
  uSunDir:      { value: new THREE.Vector3(0, 1, 0) },
  uMoonDir:     { value: new THREE.Vector3(0, -1, 0) },
  uZenithColor: { value: new THREE.Color(0x1a4aa8) },
  uHorizonColor:{ value: new THREE.Color(0x9cbfe4) },
  uSunGlowColor:{ value: new THREE.Color(0xfff2d8) },
  uSunGlow:     { value: 0.4 },
  uSunDisc:     { value: 2.0 },
  uMoonGlow:    { value: 0.0 },
  uStarAmount:  { value: 0.0 },
  uFlash:       { value: 0.0 }
};
const skyMaterial = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  vertexShader: `
    varying vec3 vSkyDir;
    void main(){
      vSkyDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uSunDir;
    uniform vec3 uMoonDir;
    uniform vec3 uZenithColor;
    uniform vec3 uHorizonColor;
    uniform vec3 uSunGlowColor;
    uniform float uSunGlow;
    uniform float uSunDisc;
    uniform float uMoonGlow;
    uniform float uStarAmount;
    uniform float uFlash;
    varying vec3 vSkyDir;
    void main(){
      vec3 dirN = normalize(vSkyDir);
      float upness = clamp(dirN.y, 0.0, 1.0);
      vec3 col = mix(uHorizonColor, uZenithColor, pow(upness, 0.58));
      col = mix(uHorizonColor * 0.88, col, smoothstep(-0.08, 0.02, dirN.y));
      float sunDot = dot(dirN, uSunDir);
      float sunPos = clamp(sunDot, 0.0, 1.0);
      col += uSunGlowColor * pow(sunPos, 7.0) * uSunGlow;
      col += uSunGlowColor * pow(sunPos, 90.0) * uSunGlow * 1.6;
      float discFactor = smoothstep(0.99962, 0.99987, sunDot);
      col += vec3(1.0, 0.94, 0.82) * discFactor * uSunDisc;
      float moonDot = clamp(dot(dirN, uMoonDir), 0.0, 1.0);
      col += vec3(0.75, 0.80, 1.0) * pow(moonDot, 900.0) * uMoonGlow * 2.0;
      col += vec3(0.72, 0.78, 0.95) * pow(moonDot, 24.0) * uMoonGlow * 0.10;
      if (uStarAmount > 0.002 && dirN.y > 0.0){
        vec3 spCell = dirN * 300.0;
        vec3 cellId = floor(spCell);
        vec3 cellF = fract(spCell) - 0.5;
        float starSeed = fract(sin(dot(cellId, vec3(12.989, 78.233, 37.719))) * 43758.545);
        float starSel = step(0.972, starSeed);
        vec3 starOff = fract(vec3(starSeed * 71.7, starSeed * 39.3, starSeed * 17.9)) - 0.5;
        float starDist = length(cellF - starOff * 0.6);
        float twinkle = 0.75 + 0.25 * sin(uTime * (2.0 + starSeed * 4.0) + starSeed * 40.0);
        float starGlow = starSel * smoothstep(0.20, 0.02, starDist) * twinkle;
        col += vec3(0.9, 0.93, 1.0) * starGlow * uStarAmount * smoothstep(0.02, 0.2, dirN.y);
      }
      col += vec3(0.80, 0.85, 1.0) * uFlash * 0.5;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(9000, 48, 24), skyMaterial);
scene.add(skyDome);

/* Moon mesh */
const moonMesh = new THREE.Mesh(
  new THREE.SphereGeometry(120, 24, 16),
  new THREE.MeshBasicMaterial({ color: 0xe8edf5, fog: false, transparent: true, opacity: 0 })
);
scene.add(moonMesh);

/* ============================= clouds ============================= */
function makeCloudLayer(planeY, noiseScale, driftX, driftZ){
  const layerUniforms = {
    uTime:       { value: 0 },
    uCoverage:   { value: 0.2 },
    uOpacity:    { value: 0.85 },
    uCloudLit:   { value: new THREE.Color(0xf2f4f7) },
    uCloudShade: { value: new THREE.Color(0x8d99a8) },
    uScale:      { value: noiseScale },
    uDriftOff:   { value: new THREE.Vector2(0, 0) },
    uSeed:       { value: Math.random() * 40 }
  };
  const layerMaterial = new THREE.ShaderMaterial({
    uniforms: layerUniforms,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    fog: false,
    vertexShader: `
      varying vec3 vCloudWorld;
      void main(){
        vCloudWorld = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: GLSL_NOISE + `
      uniform float uCoverage;
      uniform float uOpacity;
      uniform vec3 uCloudLit;
      uniform vec3 uCloudShade;
      uniform float uScale;
      uniform vec2 uDriftOff;
      uniform float uSeed;
      varying vec3 vCloudWorld;
      void main(){
        vec2 cp = vCloudWorld.xz * uScale + uDriftOff + vec2(uSeed, uSeed * 1.7);
        float shapeA = ggFbm(cp);
        float shapeB = ggFbm(cp * 2.3 + vec2(4.7, 8.1) + uDriftOff * 0.55);
        float combined = shapeA * 0.72 + shapeB * 0.28;
        float thresh = mix(0.62, 0.16, uCoverage);
        float dens = smoothstep(thresh, thresh + 0.30, combined);
        float edgeFade = 1.0 - smoothstep(4200.0, 6600.0, length(vCloudWorld.xz));
        float alphaOut = dens * uOpacity * edgeFade;
        vec3 colOut = mix(uCloudLit, uCloudShade, dens * 0.85);
        gl_FragColor = vec4(colOut, alphaOut);
      }
    `
  });
  const layerMesh = new THREE.Mesh(new THREE.PlaneGeometry(14000, 14000, 1, 1), layerMaterial);
  layerMesh.rotation.x = -Math.PI / 2;
  layerMesh.position.y = planeY;
  layerMesh.renderOrder = 2;
  scene.add(layerMesh);
  return { mesh: layerMesh, uniforms: layerUniforms, baseDrift: new THREE.Vector2(driftX, driftZ) };
}
const cloudLayerHigh = makeCloudLayer(950, 0.00016, 3.2, 0.9);
const cloudLayerLow  = makeCloudLayer(760, 0.00027, 4.6, -1.4);

/* ======================= distant hill bowl ======================= */
(function buildHorizonHills(){
  const hillGeoms = [];
  const hillProto = new THREE.SphereGeometry(1, 14, 10);
  for (let hIdx = 0; hIdx < 16; hIdx++){
    const azimuth = (hIdx / 16) * Math.PI * 2;
    const azDeg = azimuth * 180 / Math.PI;
    if (azDeg > 150 && azDeg < 215) continue; /* open Pacific to the west */
    const radiusOut = 4800 + hashJs(hIdx, 3) * 900;
    const hx = Math.cos(azimuth) * radiusOut;
    const hz = Math.sin(azimuth) * radiusOut;
    const hg = hillProto.clone();
    hg.scale(900 + hashJs(hIdx, 7) * 700, 150 + hashJs(hIdx, 11) * 130, 750);
    hg.rotateY(azimuth + hashJs(hIdx, 13));
    hg.translate(hx, -40, hz);
    hillGeoms.push(hg);
  }
  const bowlMesh = new THREE.Mesh(
    mergeGeometries(hillGeoms),
    new THREE.MeshStandardMaterial({ color: 0x5c6a72, roughness: 1, flatShading: false })
  );
  scene.add(bowlMesh);
})();

/* ============================= water ============================= */
const waterUniforms = {
  uTime:       { value: 0 },
  uWaveAmp:    { value: 0.9 },
  uChop:       { value: 0.3 },
  uFoam:       { value: 0.3 },
  uSunDir:     { value: new THREE.Vector3(0, 1, 0) },
  uSunColor:   { value: new THREE.Color(0xfff0d8) },
  uSunSpec:    { value: 1.0 },
  uMoonDir:    { value: new THREE.Vector3(0, -1, 0) },
  uMoonSpec:   { value: 0.0 },
  uZenith:     { value: new THREE.Color(0x1a4aa8) },
  uHorizon:    { value: new THREE.Color(0x9cbfe4) },
  uWaterColor: { value: new THREE.Color(0x104a52) },
  uDeepColor:  { value: new THREE.Color(0x06222c) },
  uLightFactor:{ value: 1.0 },
  uFogColor:   { value: new THREE.Color(0x9ab4c9) },
  uFogDensity: { value: 0.00005 },
  uFlash:      { value: 0.0 },
  uCometPos:   { value: new THREE.Vector3(0, 500, 0) },
  uCometGlow:  { value: 0.0 },
  uRain:       { value: 0.0 }
};
const waterMaterial = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  fog: false,
  vertexShader: GLSL_NOISE + `
    uniform float uTime;
    uniform float uWaveAmp;
    uniform float uChop;
    varying vec3 vWaterPos;
    varying vec3 vWaterNormal;
    varying float vCrest;
    float ggWaveHeight(vec2 wp){
      float total = 0.0;
      total += sin(dot(wp, vec2(0.9, 0.35)) * 0.016 + uTime * 0.90) * 1.05;
      total += sin(dot(wp, vec2(-0.7, 0.7)) * 0.030 + uTime * 1.35) * 0.60;
      total += sin(dot(wp, vec2(0.2, -0.97)) * 0.050 + uTime * 1.80) * 0.40;
      total += sin(dot(wp, vec2(-0.8, -0.55)) * 0.090 + uTime * 2.60) * 0.25 * (0.5 + uChop);
      total += (ggNoise(wp * 0.012 + vec2(uTime * 0.05, 0.0)) - 0.5) * 2.4;
      total += (ggNoise(wp * 0.045 - vec2(0.0, uTime * 0.11)) - 0.5) * 1.1;
      return total * uWaveAmp;
    }
    void main(){
      vec2 baseXZ = position.xz;
      float hC = ggWaveHeight(baseXZ);
      float hX = ggWaveHeight(baseXZ + vec2(2.2, 0.0));
      float hZ = ggWaveHeight(baseXZ + vec2(0.0, 2.2));
      vec3 displaced = vec3(position.x, hC, position.z);
      vWaterNormal = normalize(vec3(hC - hX, 2.2, hC - hZ));
      vWaterPos = displaced;
      vCrest = hC / max(uWaveAmp * 2.4, 0.001);
      gl_Position = projectionMatrix * viewMatrix * vec4(displaced, 1.0);
    }
  `,
  fragmentShader: GLSL_NOISE + `
    uniform float uTime;
    uniform float uChop;
    uniform float uFoam;
    uniform vec3 uSunDir;
    uniform vec3 uSunColor;
    uniform float uSunSpec;
    uniform vec3 uMoonDir;
    uniform float uMoonSpec;
    uniform vec3 uZenith;
    uniform vec3 uHorizon;
    uniform vec3 uWaterColor;
    uniform vec3 uDeepColor;
    uniform float uLightFactor;
    uniform vec3 uFogColor;
    uniform float uFogDensity;
    uniform float uFlash;
    uniform vec3 uCometPos;
    uniform float uCometGlow;
    uniform float uRain;
    varying vec3 vWaterPos;
    varying vec3 vWaterNormal;
    varying float vCrest;
    void main(){
      vec2 duv = vWaterPos.xz * 0.21;
      float detC = ggNoise(duv + vec2(uTime * 0.8, uTime * 0.3));
      float detX = ggNoise(duv + vec2(0.16, 0.0) + vec2(uTime * 0.8, uTime * 0.3));
      float detZ = ggNoise(duv + vec2(0.0, 0.16) + vec2(uTime * 0.8, uTime * 0.3));
      float detailAmp = 0.22 + uRain * 0.40 + uChop * 0.22;
      vec3 nrm = normalize(vWaterNormal + vec3((detC - detX), 0.0, (detC - detZ)) * detailAmp);
      vec3 viewDir = normalize(cameraPosition - vWaterPos);
      vec3 reflDir = reflect(-viewDir, nrm);
      reflDir.y = abs(reflDir.y);
      vec3 skyRefl = mix(uHorizon, uZenith, pow(reflDir.y, 0.6));
      float fres = 0.02 + 0.98 * pow(1.0 - max(dot(nrm, viewDir), 0.0), 5.0);
      fres = min(fres, 0.72);
      float patchVar = ggFbm(vWaterPos.xz * 0.0016);
      vec3 baseCol = mix(uDeepColor, uWaterColor, clamp(0.5 + vCrest * 0.4 + (patchVar - 0.5) * 0.3, 0.0, 1.0));
      baseCol *= uLightFactor;
      vec3 col = mix(baseCol, skyRefl, fres);
      float glitter = 0.55 + 0.45 * ggNoise(vWaterPos.xz * 1.7 + vec2(uTime * 1.3, -uTime * 0.9));
      float sunSpecPow = mix(420.0, 70.0, clamp(uChop, 0.0, 1.0));
      float sunSpecTerm = pow(max(dot(reflDir, uSunDir), 0.0), sunSpecPow);
      col += uSunColor * sunSpecTerm * uSunSpec * glitter * 1.6;
      float moonSpecTerm = pow(max(dot(reflDir, uMoonDir), 0.0), 500.0);
      col += vec3(0.72, 0.80, 0.95) * moonSpecTerm * uMoonSpec * glitter * 2.2;
      vec3 toComet = normalize(uCometPos - vWaterPos);
      float cometSpec = pow(max(dot(reflDir, toComet), 0.0), 130.0);
      col += vec3(1.0, 0.80, 0.45) * cometSpec * uCometGlow * 1.6;
      col += vec3(1.0, 0.85, 0.50) * uCometGlow * 0.015;
      float foamNoise = ggFbm(vWaterPos.xz * 0.35 + vec2(uTime * 0.35, uTime * 0.2));
      float crestMask = smoothstep(0.45, 0.95, vCrest);
      float foamMask = crestMask * uFoam * smoothstep(0.35, 0.75, foamNoise);
      vec3 foamCol = vec3(0.88, 0.93, 0.95) * (0.25 + uLightFactor * 0.75);
      col = mix(col, foamCol, clamp(foamMask, 0.0, 0.85));
      col = mix(col, col * vec3(0.82, 0.86, 0.9), uRain * 0.4);
      col += vec3(0.70, 0.75, 0.9) * uFlash * 0.35;
      float viewDist = length(cameraPosition - vWaterPos);
      float fogAmt = 1.0 - exp(-viewDist * viewDist * uFogDensity * uFogDensity);
      col = mix(col, uFogColor, fogAmt);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const waterMesh = new THREE.Mesh(new THREE.PlaneGeometry(7000, 7000, 250, 250), waterMaterial);
waterMesh.geometry.rotateX(-Math.PI / 2);
scene.add(waterMesh);

/* ======================= terrain & road layout ======================= */
const ROAD_END = 1620;
const DECK_TOP = 64.6;
function roadCenterX(rz){
  if (rz > 900) return Math.pow((rz - 900) / 700, 2) * 160;
  if (rz < -900) return Math.pow((-rz - 900) / 700, 2) * 130;
  return 0;
}
function roadDerivX(rz){
  if (rz > 900) return 2 * (rz - 900) * 160 / 490000;
  if (rz < -900) return -2 * (-rz - 900) * 130 / 490000;
  return 0;
}
function roadElevation(rz){
  return 65 - 24 * smoothstepJs(840, 1600, Math.abs(rz));
}
function terrainHeight(tx, tz){
  const absZ = Math.abs(tz);
  const opening = smoothstepJs(650, 2500, Math.abs(tx));
  const channelHalf = 560 + opening * 2040;
  const shoreAmp = 55 + opening * 240;
  const shoreNoise = (fbmJs(tx * 0.004 + 11, tz * 0.004 + 7) - 0.5) * shoreAmp;
  const landT = smoothstepJs(channelHalf + shoreNoise, channelHalf + shoreNoise + 300, absZ);
  const northBoost = tz < 0 ? 1.3 : 0.85;
  let hgt = -30 + (fbmJs(tx * 0.006 + 3, tz * 0.006 + 5) - 0.5) * 6;
  if (landT > 0){
    const hills = fbmJs(tx * 0.0013, tz * 0.0013);
    hgt = lerp(hgt, 20 + hills * 165 * landT * northBoost + landT * 26, landT);
  }
  /* SF peninsula platform for the skyline */
  const peninsula = 24 * gauss2(tx - 2850, tz - 1850, 520);
  if (peninsula > 1.5) hgt = Math.max(hgt, peninsula + fbmJs(tx * 0.01, tz * 0.01) * 6);
  /* crest bumps that hide the road ends */
  hgt += 105 * gauss2(tx - 360, tz - 1880, 300);
  hgt += 118 * gauss2(tx - 300, tz + 1880, 300);
  /* keep a corridor clear for the approach roads */
  if (absZ > 640 && absZ < ROAD_END + 40){
    const lateral = Math.abs(tx - roadCenterX(tz));
    if (lateral < 95){
      const maxTerr = roadElevation(tz) - 4 - (95 - lateral) * 0.12;
      hgt = Math.min(hgt, maxTerr);
    }
  }
  return hgt;
}

(function shapeTerrain(){
  const posAttr = terrainGeom.attributes.position;
  const vertexCount = posAttr.count;
  const colorArr = new Float32Array(vertexCount * 3);
  const colGreen = new THREE.Color(0.075, 0.20, 0.075);
  const colGolden = new THREE.Color(0.45, 0.38, 0.18);
  const colRock = new THREE.Color(0.42, 0.40, 0.36);
  const colSand = new THREE.Color(0.45, 0.41, 0.30);
  const colSeabed = new THREE.Color(0.10, 0.16, 0.15);
  const tmpCol = new THREE.Color();
  for (let vIdx = 0; vIdx < vertexCount; vIdx++){
    const vx = posAttr.getX(vIdx);
    const vz = posAttr.getZ(vIdx);
    const vh = terrainHeight(vx, vz);
    posAttr.setY(vIdx, vh);
    const hN = terrainHeight(vx + 14, vz);
    const hE = terrainHeight(vx, vz + 14);
    const slope = (Math.abs(vh - hN) + Math.abs(vh - hE)) / 14;
    if (vh < 1.5){
      tmpCol.copy(colSeabed).lerp(colSand, smoothstepJs(-14, 1.5, vh));
    } else {
      const highT = Math.pow(clamp01((vh - 28) / 150), 1.35);
      tmpCol.copy(colGreen).lerp(colGolden, highT);
      tmpCol.lerp(colRock, smoothstepJs(0.85, 1.6, slope) * 0.65);
    }
    const varN = 0.9 + fbmJs(vx * 0.02, vz * 0.02) * 0.22;
    colorArr[vIdx * 3]     = tmpCol.r * varN;
    colorArr[vIdx * 3 + 1] = tmpCol.g * varN;
    colorArr[vIdx * 3 + 2] = tmpCol.b * varN;
  }
  terrainGeom.setAttribute('color', new THREE.BufferAttribute(colorArr, 3));
  terrainGeom.computeVertexNormals();
})();

  terrainGeom,

(function plantTrees(){
  const TREE_COUNT = 640;
  const trunkMesh = new THREE.InstancedMesh(
    new THREE.CylinderGeometry(0.35, 0.55, 1, 5),
    new THREE.MeshStandardMaterial({ color: 0x4a3826, roughness: 1 }),
    TREE_COUNT
  );
  const canopyMesh = new THREE.InstancedMesh(
    new THREE.ConeGeometry(1, 1, 7),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 }),
    TREE_COUNT
  );
  const tmpM = new THREE.Matrix4();
  const tmpP = new THREE.Vector3();
  const tmpQ = new THREE.Quaternion();
  const tmpS = new THREE.Vector3();
  const canopyCol = new THREE.Color();
  let placed = 0, attempts = 0;
  while (placed < TREE_COUNT && attempts < 20000){
    attempts++;
    const px = (Math.random() * 2 - 1) * 2900;
    const pz = (Math.random() * 2 - 1) * 2900;
    const ph = terrainHeight(px, pz);
    if (ph < 12 || ph > 150) continue;
    const slopeChk = Math.abs(terrainHeight(px + 10, pz) - ph) + Math.abs(terrainHeight(px, pz + 10) - ph);
    if (slopeChk > 13) continue;
    if (Math.abs(pz) > 620 && Math.abs(px - roadCenterX(pz)) < 90) continue;
    if (px > 2300 && pz > 1300) continue; /* skyline district */
    const treeH = 7 + Math.random() * 9;
    tmpQ.identity();
    tmpP.set(px, ph + treeH * 0.18, pz); tmpS.set(1, treeH * 0.4, 1);
    tmpM.compose(tmpP, tmpQ, tmpS); trunkMesh.setMatrixAt(placed, tmpM);
    tmpP.set(px, ph + treeH * 0.36 + treeH * 0.42, pz);
    tmpS.set(treeH * 0.34, treeH * 0.84, treeH * 0.34);
    tmpM.compose(tmpP, tmpQ, tmpS); canopyMesh.setMatrixAt(placed, tmpM);
    const dryT = clamp01((ph - 20) / 130);
    canopyCol.setRGB(0.10 + dryT * 0.16 + Math.random() * 0.05,
                     0.26 - dryT * 0.06 + Math.random() * 0.06,
                     0.11 + Math.random() * 0.04);
    canopyMesh.setColorAt(placed, canopyCol);
    placed++;
  }
  trunkMesh.count = placed; canopyMesh.count = placed;
  trunkMesh.instanceMatrix.needsUpdate = true;
  canopyMesh.instanceMatrix.needsUpdate = true;
  if (canopyMesh.instanceColor) canopyMesh.instanceColor.needsUpdate = true;
  scene.add(trunkMesh); scene.add(canopyMesh);
})();

const TOWER_Z = 450, TOWER_TOP = 192, LEG_X = 16;

function cableHeightAt(cz){
  const az = Math.abs(cz);
  if (az <= TOWER_Z) return 74 + (TOWER_TOP - 74) * Math.pow(az / TOWER_Z, 2);
  if (az <= 780){
    const t = (az - TOWER_Z) / 330;
    return TOWER_TOP - 122 * (t * (2 - t));
  }
  return 70 - (az - 780) * 0.5;
}

(function buildTowers(){
  const towerParts = [];
  function legPair(sx, ys, ye, sz){
    const legH = ye - ys, legMid = (ys + ye) / 2;
    const gLeft = new THREE.BoxGeometry(sx, legH, sz); gLeft.translate(-LEG_X, legMid, 0);
    const gRight = new THREE.BoxGeometry(sx, legH, sz); gRight.translate(LEG_X, legMid, 0);
    towerParts.push(gLeft, gRight);
  }
  legPair(6.5, -2, 64, 10);
  legPair(6.0, 64, 118, 9.2);
  legPair(5.5, 118, 158, 8.4);
  legPair(5.0, 158, 194, 7.6);

function makeRoadTexture(){
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#2b2d2f'; ctx.fillRect(0, 0, 512, 256);
  for (let sp = 0; sp < 900; sp++){
    const g = 38 + Math.random() * 20;
    ctx.fillStyle = `rgb(${g},${g},${g + 2})`;
    ctx.fillRect(Math.random() * 512, Math.random() * 256, 2, 2);
  }
  function xToPx(uRoad){ return (uRoad + 15) / 30 * 512; }
  ctx.fillStyle = '#c9cdd1';
  for (const laneEdge of [-12, 12]){
    ctx.fillRect(xToPx(laneEdge) - 2, 0, 4, 256);
  }
  for (const laneEdge of [-8, -4, 4, 8]){
    for (let dashY = 8; dashY < 256; dashY += 64){
      ctx.fillRect(xToPx(laneEdge) - 1.5, dashY, 3, 26);
    }
  }
  ctx.fillStyle = '#d9b93a';
  ctx.fillRect(xToPx(-0.45) - 1.5, 0, 3, 256);
  ctx.fillRect(xToPx(0.45) - 1.5, 0, 3, 256);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
const roadMat = new THREE.MeshStandardMaterial({ map: makeRoadTexture(), roughness: 0.92, metalness: 0.05 });

const roadSampleStep = 12;
(function buildRoadRibbon(){
  const verts = [], uvs = [], idxArr = [];
  let sampleIdx = 0, cumLen = 0;
  let prevCX = roadCenterX(-ROAD_END), prevZ = -ROAD_END;
  for (let rz = -ROAD_END; rz <= ROAD_END; rz += roadSampleStep){
    const cx = roadCenterX(rz);
    const cy = roadElevation(rz);
    const d = roadDerivX(rz);
    const tLen = Math.hypot(d, 1);
    const perpX = 1 / tLen, perpZ = -d / tLen;
    cumLen += Math.hypot(cx - prevCX, rz - prevZ);
    prevCX = cx; prevZ = rz;
    verts.push(cx - perpX * 14.5, cy, rz - perpZ * 14.5);
    verts.push(cx + perpX * 14.5, cy, rz + perpZ * 14.5);
    uvs.push(0, cumLen / 40, 1, cumLen / 40);
    if (sampleIdx > 0){
      const b = sampleIdx * 2;
      idxArr.push(b - 2, b, b - 1, b, b + 1, b - 1);
    }
    sampleIdx++;
  }
  const roadGeom = new THREE.BufferGeometry();
  roadGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  roadGeom.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
  roadGeom.setIndex(idxArr);
  roadGeom.computeVertexNormals();
  const roadMesh = new THREE.Mesh(roadGeom, roadMat);
  roadMesh.position.y = 0.08;
  scene.add(roadMesh);
})();

    const lane = TRAFFIC_LANES[laneIdx];
    let cursor = -ROAD_END + Math.random() * 24;
    const laneSlots = [];
    while (true){
      let typeIdx;
      if (lane.heavyOk && Math.random() < 0.28){
        const heavyIdx = [9, 10, 11];
        typeIdx = heavyIdx[Math.floor(Math.random() * heavyIdx.length)];
      } else {
        typeIdx = Math.floor(Math.random() * 9);
        if (typeIdx === 7 && Math.random() > 0.35) typeIdx = 1; /* fewer taxis */
      }
      const vType = VEHICLE_TYPES[typeIdx];
      const slotPos = cursor + vType.len / 2;
      if (slotPos + vType.len / 2 > ROAD_END - 4) break;
      laneSlots.push({ laneIdx, typeIdx, basePos: slotPos, colorHex: vType.fixedColor ?? pickCarColor() });
      cursor = slotPos + vType.len / 2 + 26 + Math.random() * 42;
    }
    /* stable random ranks so the density slider hides a consistent subset */
    const order = laneSlots.map((slot, oi) => oi);
    for (let sh = order.length - 1; sh > 0; sh--){
      const sw = Math.floor(Math.random() * (sh + 1));
      const held = order[sh]; order[sh] = order[sw]; order[sw] = held;
    }
    for (let oi = 0; oi < order.length; oi++){
      laneSlots[order[oi]].rankNorm = oi / Math.max(order.length - 1, 1);
    }
    for (const slot of laneSlots) trafficSlots.push(slot);
  }
})();

const trafficTmpM = new THREE.Matrix4();
const trafficTmpP = new THREE.Vector3();
const trafficTmpQ = new THREE.Quaternion();
const trafficTmpS = new THREE.Vector3();
const yUpAxis = new THREE.Vector3(0, 1, 0);
function updateTraffic(simTime, densityFrac){
  for (const slot of trafficSlots){
    const lane = TRAFFIC_LANES[slot.laneIdx];
    const vType = VEHICLE_TYPES[slot.typeIdx];
    const active = slot.rankNorm <= densityFrac && densityFrac > 0.001;
    if (!active){
      trafficTmpS.set(0.0001, 0.0001, 0.0001);
      trafficTmpP.set(0, -500, 0);
      trafficTmpQ.identity();
      trafficTmpM.compose(trafficTmpP, trafficTmpQ, trafficTmpS);
      vehicleMeshes[slot.typeIdx].setMatrixAt(slot.instanceIdx, trafficTmpM);
      headBarMesh.setMatrixAt(slot.slotId, trafficTmpM);
      tailBarMesh.setMatrixAt(slot.slotId, trafficTmpM);
      continue;
    }
    const sPos = wrapRange(slot.basePos + lane.dirSign * lane.speed * simTime, -ROAD_END, ROAD_END);
    const cx = roadCenterX(sPos), cy = roadElevation(sPos), d = roadDerivX(sPos);
    const tLen = Math.hypot(d, 1);
    const perpX = 1 / tLen, perpZ = -d / tLen;
    const headX = d * lane.dirSign / tLen, headZ = lane.dirSign / tLen;
    const yaw = Math.atan2(headX, headZ);
    trafficTmpP.set(cx + perpX * lane.offset, cy + 0.12, sPos + perpZ * lane.offset);
    trafficTmpQ.setFromAxisAngle(yUpAxis, yaw);
    trafficTmpS.set(1, 1, 1);
    trafficTmpM.compose(trafficTmpP, trafficTmpQ, trafficTmpS);
    vehicleMeshes[slot.typeIdx].setMatrixAt(slot.instanceIdx, trafficTmpM);
    /* light bars */
    const sinY = Math.sin(yaw), cosY = Math.cos(yaw);
    const frontOff = vType.len / 2 - 0.04;
    trafficTmpS.set(vType.width * 0.72, 0.14, 0.12);
    trafficTmpP.set(trafficTmpP.x + sinY * frontOff, cy + 0.12 + vType.lightY, trafficTmpP.z + cosY * frontOff);
    trafficTmpM.compose(trafficTmpP, trafficTmpQ, trafficTmpS);
    headBarMesh.setMatrixAt(slot.slotId, trafficTmpM);
    trafficTmpP.set(trafficTmpP.x - sinY * 2 * frontOff, cy + 0.12 + vType.lightY, trafficTmpP.z - cosY * 2 * frontOff);
    trafficTmpM.compose(trafficTmpP, trafficTmpQ, trafficTmpS);
    tailBarMesh.setMatrixAt(slot.slotId, trafficTmpM);
  }
  for (const vMesh of vehicleMeshes) vMesh.instanceMatrix.needsUpdate = true;
  headBarMesh.instanceMatrix.needsUpdate = true;
  tailBarMesh.instanceMatrix.needsUpdate = true;
}

function updateShips(simTime, waveNorm){
  for (const ship of shipList){
    const u = ((ship.phase + simTime * ship.speed / ship.loopLen) % 1 + 1) % 1;
    ship.curve.getPointAt(u, shipTmpPos);
    ship.curve.getTangentAt(u, shipTmpTan);
    ship.group.position.set(shipTmpPos.x,
      Math.sin(simTime * 1.25 + ship.bobPhase) * 0.35 * (0.35 + waveNorm), shipTmpPos.z);
    ship.group.rotation.y = Math.atan2(shipTmpTan.x, shipTmpTan.z);
    ship.group.rotation.z = Math.sin(simTime * 1.05 + ship.bobPhase) * 0.028 * (0.3 + waveNorm);
    ship.group.rotation.x = Math.sin(simTime * 0.9 + ship.bobPhase * 2) * 0.018 * (0.3 + waveNorm);
  }

const FOG_PUFF_COUNT = 240;
const fogUniformsBank = {
  uTime:        { value: 0 },

  uFogStrength: { value: 0.25 },

const fogPuffMaterial = new THREE.ShaderMaterial({
  uniforms: fogUniformsBank,
  transparent: true,
  depthWrite: false,
  fog: false,
  vertexShader: `
    uniform float uTime;
    uniform float uWind;
    uniform float uFogTop;
    varying vec2 vPuffUv;
    varying float vPuffAlpha;
    void main(){
      vPuffUv = uv;
      vec4 instPos4 = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
      float puffScale = length(vec3(instanceMatrix[0].x, instanceMatrix[0].y, instanceMatrix[0].z));
      #ifdef USE_INSTANCING_COLOR
        float baseAlpha = instanceColor.r;
        float puffPhase = instanceColor.g * 12.566;
      #else
        float baseAlpha = 0.1;
        float puffPhase = 0.0;
      #endif
      float wx = mod(instPos4.x + uTime * uWind + 1600.0, 3200.0) - 1600.0;
      float wz = instPos4.z + sin(uTime * 0.05 + puffPhase) * 42.0;
      float edgeFade = smoothstep(1600.0, 1220.0, abs(wx));
      float heightFade = smoothstep(uFogTop + 20.0, uFogTop - 34.0, instPos4.y);
      vPuffAlpha = baseAlpha * edgeFade * heightFade;
      vec3 camRight = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
      vec3 camUp = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
      vec3 worldP = vec3(wx, instPos4.y, wz) + (camRight * position.x + camUp * position.y) * puffScale;
      gl_Position = projectionMatrix * viewMatrix * vec4(worldP, 1.0);
    }
  `,
  fragmentShader: GLSL_NOISE + `
    uniform float uFogStrength;
    uniform vec3 uFogColor;
    uniform float uTime;
    varying vec2 vPuffUv;
    varying float vPuffAlpha;
    void main(){

      vec3 camUp = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);

  const cCol = new THREE.Color(0, 0, 0);

const cometState = {
  active: false, t: 0, dur: 7.0,
  start: new THREE.Vector3(2600, 640, -260),
  end: new THREE.Vector3(-2650, 360, 220),
  pos: new THREE.Vector3(),
  history: []
};
for (let hi = 0; hi < COMET_TRAIL; hi++) cometState.history.push(new THREE.Vector3(0, -9000, 0));
const cometTmpM = new THREE.Matrix4(), cometTmpQ = new THREE.Quaternion(),
      cometTmpS = new THREE.Vector3(), cometTmpC = new THREE.Color();
function startComet(){
  if (cometState.active) return;
  cometState.active = true;
  cometState.t = 0;
  for (const hv of cometState.history) hv.set(cometState.start.x, cometState.start.y, cometState.start.z);
  cometMesh.visible = true;
}
function updateComet(dt){
  if (!cometState.active){
    waterUniforms.uCometGlow.value = 0;
    cometLight.intensity = 0;
    return;
  }
  cometState.t += dt;
  const prog = cometState.t / cometState.dur;
  if (prog >= 1){
    cometState.active = false;
    cometMesh.visible = false;
    waterUniforms.uCometGlow.value = 0;
    cometLight.intensity = 0;
    return;
  }
  cometState.pos.lerpVectors(cometState.start, cometState.end, prog);
  cometState.pos.y += Math.sin(prog * Math.PI) * 70;
  /* history ring: shift by copying (100 vec3s, cheap) */
  for (let hi2 = COMET_TRAIL - 1; hi2 > 0; hi2--){
    cometState.history[hi2].copy(cometState.history[hi2 - 1]);
  }
  cometState.history[0].copy(cometState.pos);
  const envelope = Math.min(prog / 0.06, 1) * Math.min((1 - prog) / 0.12, 1);
  for (let hi3 = 0; hi3 < COMET_TRAIL; hi3++){
    const ageT = hi3 / COMET_TRAIL;
    const qScale = hi3 === 0 ? 46 : 10 + ageT * 66;
    cometTmpS.set(qScale, qScale, qScale);
    cometTmpQ.identity();
    cometTmpM.compose(cometState.history[hi3], cometTmpQ, cometTmpS);
    cometMesh.setMatrixAt(hi3, cometTmpM);
    const alphaV = hi3 === 0 ? envelope : Math.pow(1 - ageT, 1.8) * 0.55 * envelope;
    const heatV = hi3 === 0 ? 1 : Math.pow(1 - ageT, 2.2);
    cometTmpC.setRGB(alphaV, heatV, 0);
    cometMesh.setColorAt(hi3, cometTmpC);
  }
  cometMesh.instanceMatrix.needsUpdate = true;
  if (cometMesh.instanceColor) cometMesh.instanceColor.needsUpdate = true;
  waterUniforms.uCometPos.value.copy(cometState.pos);
  waterUniforms.uCometGlow.value = envelope * 1.8;
  cometLight.position.copy(cometState.pos);
  cometLight.target.position.set(0, 40, 0);
  cometLight.intensity = envelope * 1.7;
}

        if (roll2 < 0.48){ whale.mode = 'surface'; whale.timer = 6; }
        else if (roll2 < 0.66){ whale.mode = 'breach'; whale.timer = 3.4; }
        else if (roll2 < 0.82){ whale.mode = 'tailslap'; whale.timer = 4.6; }
        else { whale.timer = 5 + Math.random() * 8; }
      }
    } else if (whale.mode === 'surface'){
      const p = 1 - whale.timer / 6;
      targetY = -9 + 13.2 * Math.pow(Math.max(Math.sin(Math.PI * Math.min(p * 1.04, 1)), 0), 1.15);
      whale.pitch = -Math.cos(Math.PI * p) * 0.30;
      fwdSpeed = 6;
      if (!whale.blowDone && p > 0.3){
        whale.blowDone = true;
        const hx = whale.root.position.x + Math.sin(whale.yaw) * 4.5;
        const hz = whale.root.position.z + Math.cos(whale.yaw) * 4.5;
        spawnSplash(hx, 2.2, hz, 40, 12, 1.7);
        spawnRing(hx, hz, 22, 2.6);
      }
      if (targetY > -2.4 && whale.rippleClock <= 0){
        whale.rippleClock = 0.5;
        spawnRing(whale.root.position.x, whale.root.position.z, 17, 2.2);
      }
      if (whale.timer <= 0){ whale.mode = 'swim'; whale.timer = 6 + Math.random() * 9; }
    } else if (whale.mode === 'breach'){
      const p = 1 - whale.timer / 3.4;
      const arc = Math.max(Math.sin(Math.PI * clamp01((p - 0.08) / 0.78)), 0);
      targetY = -13 + 30 * arc;
      whale.pitch = 1.25 - p * 2.7;
      whale.roll = p * 1.15;
      fwdSpeed = 4; tailAmp = 0.5; tailFreq = 4.5;
      if (!whale.blowDone && whale.prevY < 0.5 && targetY >= 0.5){
        whale.blowDone = true;
        spawnSplash(whale.root.position.x, 1, whale.root.position.z, 22, 10, 1.1);
      }
      if (!whale.splashDone && whale.prevY > 1.5 && targetY <= 1.5 && p > 0.5){
        whale.splashDone = true;
        spawnSplash(whale.root.position.x, 1.6, whale.root.position.z, 130, 21, 1.3);
        spawnRing(whale.root.position.x, whale.root.position.z, 44, 3.4);
        spawnRing(whale.root.position.x, whale.root.position.z, 26, 2.4);
      }
      if (whale.timer <= 0){
        whale.mode = 'swim'; whale.timer = 8 + Math.random() * 10;
        whale.roll = 0;
      }
    } else if (whale.mode === 'tailslap'){
      targetY = -4.6;
      whale.pitch = 0.5;
      fwdSpeed = 1.2;
      whale.tailPivot.rotation.x = Math.sin(simTime * 7) * 0.95;
      if (Math.sin(simTime * 7) < -0.9 && whale.rippleClock <= 0){
        whale.rippleClock = 0.55;
        whale.tailPivot.getWorldPosition(whaleTmpV);
        spawnSplash(whaleTmpV.x, 1.0, whaleTmpV.z, 44, 14, 1.15);
        spawnRing(whaleTmpV.x, whaleTmpV.z, 19, 2.0);
      }
      if (whale.timer <= 0){ whale.mode = 'swim'; whale.timer = 6 + Math.random() * 8; }
    }
    /* movement & tail animation */
    whale.swimPhase += dt * tailFreq;
    if (whale.mode !== 'tailslap'){
      whale.tailPivot.rotation.x = Math.sin(whale.swimPhase) * tailAmp;
    }
    const stepX = Math.sin(whale.yaw) * fwdSpeed * dt;
    const stepZ = Math.cos(whale.yaw) * fwdSpeed * dt;
    const nextX = whale.root.position.x + stepX;
    const nextZ = whale.root.position.z + stepZ;
    if (isNavigableWater(nextX, nextZ)){
      whale.root.position.x = nextX;
      whale.root.position.z = nextZ;
    } else {
      sampleWhaleWaypoint(whale.home, whale.waypoint);
      whale.yaw += Math.PI * 0.5 * dt;
    }
    whale.prevY = whale.root.position.y;
    whale.root.position.y = lerp(whale.root.position.y, targetY, Math.min(dt * 2.4, 1));
    if (whale.mode === 'breach') whale.root.position.y = targetY;
    whale.root.rotation.set(whale.pitch, whale.yaw, whale.roll, 'YXZ');
    /* moving near surface leaves disturbance */
    if (whale.root.position.y > -3 && whale.rippleClock <= 0 && whale.mode === 'swim'){
      whale.rippleClock = 0.7;
      spawnRing(whale.root.position.x, whale.root.position.z, 14, 2.0);
    }
  }
}

/* ================== weather presets & environment ================== */
const WEATHER_PRESETS = {
  clear:    { cloudCover: 0.16, cloudDark: 0.10, fogBase: 0.02, fogDensity: 0.000045, sunDim: 1.00, greyness: 0.00, rain: 0, wind: 6,  waveBoost: 0.00, cloudHiY: 950, cloudLoY: 760 },
  marine:   { cloudCover: 0.42, cloudDark: 0.22, fogBase: 0.58, fogDensity: 0.000110, sunDim: 0.80, greyness: 0.28, rain: 0, wind: 9,  waveBoost: 0.10, cloudHiY: 820, cloudLoY: 560 },
  overcast: { cloudCover: 0.97, cloudDark: 0.45, fogBase: 0.12, fogDensity: 0.000130, sunDim: 0.42, greyness: 0.72, rain: 0, wind: 12, waveBoost: 0.15, cloudHiY: 640, cloudLoY: 470 },
  storm:    { cloudCover: 1.00, cloudDark: 0.82, fogBase: 0.18, fogDensity: 0.000180, sunDim: 0.20, greyness: 0.85, rain: 1, wind: 26, waveBoost: 1.00, cloudHiY: 560, cloudLoY: 380 }
};
let weatherName = 'clear';
const weatherEnv = Object.assign({}, WEATHER_PRESETS.clear);
const uiState = { fog: 0.25, traffic: 0.55, waves: 0.30, timeT: 0.30, whaleCount: 0 };

const dayZenith = new THREE.Color(0.100, 0.290, 0.660);
const nightZenith = new THREE.Color(0.010, 0.016, 0.042);
const dayHorizon = new THREE.Color(0.600, 0.740, 0.900);
const nightHorizon = new THREE.Color(0.045, 0.060, 0.100);
const warmHorizon = new THREE.Color(1.00, 0.50, 0.24);
const greyZenith = new THREE.Color(0.40, 0.44, 0.48);
const greyHorizon = new THREE.Color(0.56, 0.58, 0.60);
const dayWaterCol = new THREE.Color(0.055, 0.190, 0.230);
const nightWaterCol = new THREE.Color(0.008, 0.020, 0.030);
const dayDeepCol = new THREE.Color(0.020, 0.075, 0.100);
const nightDeepCol = new THREE.Color(0.004, 0.010, 0.015);
const greyWaterCol = new THREE.Color(0.10, 0.12, 0.13);
const envZenith = new THREE.Color(), envHorizon = new THREE.Color(), envSunCol = new THREE.Color(),
      envFogCol = new THREE.Color(), envCloudLit = new THREE.Color(), envCloudShade = new THREE.Color(),
      envWaterCol = new THREE.Color(), envDeepCol = new THREE.Color(), envTmpCol = new THREE.Color();
const sunDirVec = new THREE.Vector3(), moonDirVec = new THREE.Vector3();
let rainLerped = 0, envDaylight = 1, envSunY = 1;

function updateEnvironment(dt, simTime){
  /* lerp weather toward the active preset */
  const preset = WEATHER_PRESETS[weatherName];
  const wk = 1 - Math.exp(-dt * 1.3);
  for (const key of Object.keys(preset)) weatherEnv[key] = lerp(weatherEnv[key], preset[key], wk);
  rainLerped = lerp(rainLerped, preset.rain, wk);

  const hour = 5 + uiState.timeT * 19;
  const sunTheta = Math.PI * (hour - 6) / 14;
  sunDirVec.set(Math.cos(sunTheta), Math.sin(sunTheta) * 0.9, 0.42).normalize();
  moonDirVec.set(Math.cos(sunTheta + Math.PI), Math.sin(sunTheta + Math.PI) * 0.8, -0.3).normalize();
  envSunY = sunDirVec.y;
  const daylight = smoothstepJs(-0.06, 0.16, envSunY);
  envDaylight = daylight;
  const glowFactor = smoothstepJs(-0.22, 0.02, envSunY);
  const warmFactor = (1 - clamp01(Math.abs(envSunY - 0.05) / 0.26)) * glowFactor;
  const greyness = weatherEnv.greyness;
  const cloudDark = weatherEnv.cloudDark;
  const cloudCover = weatherEnv.cloudCover;

  /* sky colors */
  envZenith.copy(nightZenith).lerp(dayZenith, daylight);
  envTmpCol.copy(greyZenith).multiplyScalar(0.25 + daylight * 0.75);
  envZenith.lerp(envTmpCol, greyness * 0.85);
  envZenith.multiplyScalar(1 - cloudDark * 0.30 * daylight);
  envHorizon.copy(nightHorizon).lerp(dayHorizon, daylight);
  envTmpCol.copy(greyHorizon).multiplyScalar(0.22 + daylight * 0.78);
  envHorizon.lerp(envTmpCol, greyness * 0.85);
  envHorizon.lerp(warmHorizon, warmFactor * (1 - greyness * 0.85) * 0.85);
  envHorizon.multiplyScalar(1 - cloudDark * 0.22 * daylight);
  skyUniforms.uZenithColor.value.copy(envZenith);
  skyUniforms.uHorizonColor.value.copy(envHorizon);
  envSunCol.setRGB(1.0, 0.98, 0.92).lerp(envTmpCol.setRGB(1.0, 0.55, 0.25), warmFactor);
  skyUniforms.uSunGlowColor.value.copy(envSunCol);
  skyUniforms.uSunGlow.value = (0.30 + warmFactor * 1.25) * (1 - greyness * 0.80) * glowFactor;
  skyUniforms.uSunDisc.value = (envSunY > -0.015 ? 2.3 : 0) * (1 - cloudCover * 0.93);
  const starVis = clamp01(-envSunY * 5) * (1 - cloudCover * 0.92);
  skyUniforms.uStarAmount.value = starVis;
  const moonVis = clamp01(moonDirVec.y * 3.5) * clamp01(-envSunY * 6) * (1 - cloudCover * 0.88);
  skyUniforms.uMoonGlow.value = moonVis * 0.9;
  skyUniforms.uMoonDir.value.copy(moonDirVec);
  skyUniforms.uSunDir.value.copy(sunDirVec);
  skyUniforms.uFlash.value = lightningState.flash;
  skyUniforms.uTime.value = simTime;
  moonMesh.position.copy(moonDirVec).multiplyScalar(8300);
  moonMesh.material.opacity = moonVis;

  /* lights */
  sunLight.position.copy(sunDirVec).multiplyScalar(4000);
  sunLight.intensity = 2.9 * clamp01((envSunY + 0.02) * 5) * weatherEnv.sunDim;
  sunLight.color.copy(envSunCol);
  moonLight.position.copy(moonDirVec).multiplyScalar(3000);
  moonLight.intensity = 0.42 * moonVis + 0.07 * clamp01(-envSunY * 4);
  hemiLight.color.copy(envHorizon);
  hemiLight.intensity = 0.17 + daylight * 0.65 * (1 - cloudDark * 0.5) + lightningState.flash * 1.1;
  ambientLight.intensity = 0.16 + (1 - daylight) * 0.22;
  renderer.toneMappingExposure = clampRange(0.82 + daylight * 0.28 - cloudDark * 0.18 * daylight, 0.72, 1.15);

  /* fog */
  const fogStrength = Math.max(uiState.fog, weatherEnv.fogBase);
  envFogCol.copy(envHorizon).lerp(envTmpCol.setRGB(0.85, 0.88, 0.91), daylight * 0.25 * (1 - greyness));
  scene.fog.color.copy(envFogCol);
  scene.fog.density = weatherEnv.fogDensity + fogStrength * 0.00009;
  fogUniformsBank.uFogColor.value.copy(envFogCol);
  fogUniformsBank.uFogStrength.value = fogStrength * 2.4;
  fogUniformsBank.uFogTop.value = 14 + fogStrength * 96;
  fogUniformsBank.uWind.value = weatherEnv.wind;
  fogUniformsBank.uTime.value = simTime;

  /* clouds */
  envCloudLit.setRGB(0.06, 0.07, 0.10).lerp(envTmpCol.setRGB(0.94, 0.95, 0.97), daylight);
  envCloudLit.lerp(envTmpCol.setRGB(1.0, 0.62, 0.42), warmFactor * 0.55);
  envCloudShade.copy(envCloudLit).multiplyScalar(1 - 0.45 - cloudDark * 0.35);
  const cloudDriftStep = 0.002 * (0.5 + weatherEnv.wind / 12) * dt;
  for (const layer of [cloudLayerHigh, cloudLayerLow]){
    layer.uniforms.uDriftOff.value.x += layer.baseDrift.x * cloudDriftStep;
    layer.uniforms.uDriftOff.value.y += layer.baseDrift.y * cloudDriftStep;
    layer.uniforms.uCoverage.value = cloudCover * (layer === cloudLayerLow ? 0.85 : 1);
    layer.uniforms.uCloudLit.value.copy(envCloudLit);
    layer.uniforms.uCloudShade.value.copy(envCloudShade);
    layer.uniforms.uOpacity.value = 0.55 + cloudDark * 0.4;
  }
  cloudLayerHigh.mesh.position.y = lerp(cloudLayerHigh.mesh.position.y, weatherEnv.cloudHiY, wk);
  cloudLayerLow.mesh.position.y = lerp(cloudLayerLow.mesh.position.y, weatherEnv.cloudLoY, wk);

  /* water */
  envWaterCol.copy(nightWaterCol).lerp(dayWaterCol, daylight);
  envWaterCol.lerp(greyWaterCol, greyness * 0.55 * daylight);
  envDeepCol.copy(nightDeepCol).lerp(dayDeepCol, daylight);
  waterUniforms.uTime.value = simTime;
  waterUniforms.uWaveAmp.value = (0.22 + uiState.waves * 2.1) * (1 + weatherEnv.waveBoost * 0.95);
  waterUniforms.uChop.value = clamp01(uiState.waves * 0.75 + weatherEnv.waveBoost * 0.55);
  waterUniforms.uFoam.value = clamp01(uiState.waves * 0.9 + weatherEnv.waveBoost * 0.45);
  waterUniforms.uSunDir.value.copy(sunDirVec);
  waterUniforms.uSunColor.value.copy(envSunCol);
  waterUniforms.uSunSpec.value = clamp01(envSunY * 5) * (1 - cloudCover * 0.85) * weatherEnv.sunDim;
  waterUniforms.uMoonDir.value.copy(moonDirVec);
  waterUniforms.uMoonSpec.value = moonVis;
  waterUniforms.uZenith.value.copy(envZenith);
  waterUniforms.uHorizon.value.copy(envHorizon);
  waterUniforms.uWaterColor.value.copy(envWaterCol);
  waterUniforms.uDeepColor.value.copy(envDeepCol);
  waterUniforms.uLightFactor.value = 0.16 + daylight * 0.84 * (1 - cloudDark * 0.3);
  waterUniforms.uFogColor.value.copy(envFogCol);
  waterUniforms.uFogDensity.value = scene.fog.density;
  waterUniforms.uFlash.value = lightningState.flash;
  waterUniforms.uRain.value = rainLerped;

  /* emissive intensities that follow darkness */
  const nightF = 1 - daylight;
  lampBulbMat.emissiveIntensity = nightF * 2.4 + 0.02;
  skylineMat.emissiveIntensity = nightF * 1.6 + 0.04;
  alcatrazLampMat.emissiveIntensity = (0.55 + 0.45 * Math.sin(simTime * 2.2)) * nightF * 3.2;
  headBarMat.color.setRGB(1.0, 0.96, 0.85).multiplyScalar(0.22 + nightF * 1.9);
  tailBarMat.color.setRGB(1.0, 0.20, 0.13).multiplyScalar(0.32 + nightF * 1.4);
  shipNavMat.color.setRGB(1.0, 0.94, 0.78).multiplyScalar(0.18 + nightF * 1.5);
  const blinkPulse = Math.sin(simTime * 2.6) > 0.55 ? 1 : 0.12;
  if (beaconMeshes.length) beaconMeshes[0].material.color.setRGB(1.0, 0.13, 0.07).multiplyScalar(0.25 + blinkPulse * nightF * 2.2);

  /* wet roads */
  roadMat.roughness = 0.92 - rainLerped * 0.58;
  roadMat.color.setScalar(1 - rainLerped * 0.28);
  puddleMat.opacity = rainLerped * 0.55;
  return { hour, starVis };
}

/* ============================= UI ============================= */
const fogSliderEl = document.getElementById('fogSlider');
const trafficSliderEl = document.getElementById('trafficSlider');
const waveSliderEl = document.getElementById('waveSlider');
const timeSliderEl = document.getElementById('timeSlider');
const fogValEl = document.getElementById('fogVal');
const trafficValEl = document.getElementById('trafficVal');
const waveValEl = document.getElementById('waveVal');
const timeValEl = document.getElementById('timeVal');
const statusEl = document.getElementById('status');
const cometBtnEl = document.getElementById('cometBtn');
const whaleBtnEl = document.getElementById('whaleBtn');
fogSliderEl.addEventListener('input', () => {
  uiState.fog = fogSliderEl.value / 100;
  fogValEl.textContent = fogSliderEl.value + '%';
});
trafficSliderEl.addEventListener('input', () => {
  uiState.traffic = trafficSliderEl.value / 100;
  trafficValEl.textContent = trafficSliderEl.value + '%';
});
waveSliderEl.addEventListener('input', () => {
  uiState.waves = waveSliderEl.value / 100;
  waveValEl.textContent = waveSliderEl.value + '%';
});
timeSliderEl.addEventListener('input', () => {
  uiState.timeT = timeSliderEl.value / 1000;
});
for (const wbtnEl of document.querySelectorAll('.wbtn')){
  wbtnEl.addEventListener('click', () => {
    weatherName = wbtnEl.dataset.weather;
    for (const other of document.querySelectorAll('.wbtn')) other.classList.remove('active');
    wbtnEl.classList.add('active');
  });
}
cometBtnEl.addEventListener('click', () => { startComet(); });
whaleBtnEl.addEventListener('click', () => { uiState.whaleCount = spawnWhalePod(); });

function timeOfDayLabel(hour){
  if (hour < 6.3) return 'Dawn';
  if (hour < 7.3) return 'Sunrise';
  if (hour < 11) return 'Morning';
  if (hour < 14) return 'Midday';
  if (hour < 18.2) return 'Afternoon';
  if (hour < 19.4) return 'Golden Hour';
  if (hour < 20.3) return 'Sunset';
  if (hour < 21.2) return 'Dusk';
  return 'Night';
}
function formatClock(hour){
  const wrapped = hour % 24;
  const hh = Math.floor(wrapped);
  const mm = Math.floor((wrapped - hh) * 60);
  const ampm = hh < 12 ? 'AM' : 'PM';
  const hh12 = ((hh + 11) % 12) + 1;
  return hh12 + ':' + String(mm).padStart(2, '0') + ' ' + ampm;
}

/* ============================ main loop ============================ */
const simClock = new THREE.Clock();
let simTimeTotal = 0;
let statusTimer = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(simClock.getDelta(), 0.05);
  simTimeTotal += dt;
  const envInfo = updateEnvironment(dt, simTimeTotal);
  const stormFactor = weatherName === 'storm' ? rainLerped : Math.min(rainLerped, weatherEnv.rain);
  updateLightning(simTimeTotal, stormFactor);
  updateRain(simTimeTotal, rainLerped);
  updateTraffic(simTimeTotal, uiState.traffic);
  updateShips(simTimeTotal, uiState.waves + weatherEnv.waveBoost * 0.5);
  updateBirds(simTimeTotal);
  updateComet(dt);
  const envBrightness = 0.25 + envDaylight * 0.75;
  updateWhales(dt, simTimeTotal, envBrightness);
  updateSplashes(dt, envBrightness);
  updateRings(dt, envBrightness);
  /* comet availability */
  const isNight = envSunY < -0.06;
  cometBtnEl.disabled = !isNight || cometState.active;
  /* status readout at 4 Hz */
  statusTimer -= dt;
  if (statusTimer <= 0){
    statusTimer = 0.25;
    const label = timeOfDayLabel(envInfo.hour);
    statusEl.textContent = 'Fog ' + Math.round(uiState.fog * 100) + '% · Traffic ' +
      Math.round(uiState.traffic * 100) + '% · Waves ' + Math.round(uiState.waves * 100) +
      '% · Whales ' + uiState.whaleCount + ' · ' + formatClock(envInfo.hour) + ' (' + label + ')';
    timeValEl.textContent = formatClock(envInfo.hour) + ' · ' + label;
  }
  controls.update();
  renderer.render(scene, camera);
});
window.ggbDebug = { camera, controls, whalePod, cometState, uiState };
