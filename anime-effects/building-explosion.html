<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ビル爆破カット - アニメ風流体エフェクト</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#0b0e14;color:#d8e2f0;font-family:system-ui,-apple-system,sans-serif;
       display:flex;flex-direction:column;align-items:center}
  h1{font-size:15px;font-weight:650;margin:14px 0 4px;color:#edf4ff;letter-spacing:.04em}
  #bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;
       padding:8px 14px;margin:8px;background:#121826;border:1px solid #1f2937;border-radius:8px;font-size:12px}
  label{display:flex;gap:6px;align-items:center;white-space:nowrap;color:#a9b8cf}
  input[type=range]{width:92px;accent-color:#fb923c}
  select,button{height:25px;background:#1c2434;color:#d8e2f0;border:1px solid #2a3650;border-radius:6px;
       padding:3px 10px;font-size:12px;cursor:pointer}
  button:hover,select:hover{background:#273248}
  button.active{background:#f97316;color:#170a03;border-color:#fdba74}
  #stats{font-variant-numeric:tabular-nums;color:#7dd3fc;min-width:70px;text-align:right}
  #wrap{width:min(96vw,960px);aspect-ratio:16/9;margin:4px 0 10px}
  canvas{width:100%;height:100%;display:block;border-radius:8px;box-shadow:0 8px 40px #000b;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<h1>ビル爆破カット - アニメ風流体エフェクト</h1>
<div id="bar">
  <button id="boom" class="active">爆破</button>
  <button id="reset">リセット</button>
  <label>演出 <select id="look">
    <option value="anime" selected>アニメ</option>
    <option value="dust">粉塵多め</option>
    <option value="fire">炎多め</option>
  </select></label>
  <label>爆風 <input id="power" type="range" min="0.5" max="1.8" step="0.05" value="1.05"></label>
  <label>煙量 <input id="smokeAmt" type="range" min="0.5" max="2.0" step="0.05" value="1.15"></label>
  <label>渦 <input id="vort" type="range" min="0" max="55" step="1" value="32"></label>
  <button id="pause">一時停止</button>
  <span id="stats">-- fps</span>
</div>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>

<script>
'use strict';

const W=960,H=540,GW=192,GH=108,N=GW*GH,S=W/GW;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=W*DPR; cv.height=H*DPR; cv.style.aspectRatio=`${W}/${H}`;
ctx.setTransform(DPR,0,0,DPR,0,0);

const off=document.createElement('canvas');
off.width=GW; off.height=GH;
const octx=off.getContext('2d',{willReadFrequently:true});
const img=octx.createImageData(GW,GH);

const ux=new Float32Array(N),uy=new Float32Array(N);
const ux0=new Float32Array(N),uy0=new Float32Array(N);
const pressure=new Float32Array(N),divergence=new Float32Array(N),curl=new Float32Array(N);
const smoke=new Float32Array(N),smoke0=new Float32Array(N);
const dust=new Float32Array(N),dust0=new Float32Array(N);
const heat=new Float32Array(N),heat0=new Float32Array(N);
const fire=new Float32Array(N),fire0=new Float32Array(N);
const obstacle=new Uint8Array(N);

const particles=[];
const waves=[];
const scars=[];
const blasts=[];
const speedLines=[];
const pointer={down:false,x:0,y:0,px:0,py:0};
const state={paused:false,active:false,time:0,nextEvent:0,fps:0,damage:0,flash:0,shake:0,freeze:0,last:performance.now()};
const params={power:1.05,smokeAmt:1.15,vort:32,look:'anime'};

const events=[
  {t:0.08,x:96,y:58,p:1.55,dir:0,kind:'core'},
  {t:0.16,x:74,y:57,p:1.05,dir:-1,kind:'fire'},
  {t:0.23,x:115,y:43,p:1.05,dir:1,kind:'fire'},
  {t:0.34,x:92,y:69,p:1.30,dir:-1,kind:'side'},
  {t:0.50,x:120,y:66,p:1.22,dir:1,kind:'side'},
  {t:0.72,x:76,y:78,p:1.05,dir:-1,kind:'dust'},
  {t:0.95,x:98,y:33,p:0.95,dir:0,kind:'smoke'},
  {t:1.18,x:96,y:92,p:1.18,dir:0,kind:'ground'}
];

function id(x,y){return y*GW+x}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function copy(a,b){a.set(b)}
function clearField(a){a.fill(0)}
function isBlocked(x,y){
  if(x<1||x>=GW-1||y<1||y>=GH-1) return true;
  return obstacle[id(x,y)]!==0;
}
function buildObstacle(){
  obstacle.fill(0);
  for(let y=21;y<101;y++){
    const taper=Math.max(0,Math.floor((y-21)/18)-1);
    const l=72-taper,r=121+taper;
    for(let x=l;x<=r;x++) obstacle[id(x,y)]=1;
  }
  for(let y=16;y<24;y++) for(let x=84;x<=109;x++) obstacle[id(x,y)]=1;
  for(let y=96;y<103;y++) for(let x=64;x<=130;x++) obstacle[id(x,y)]=1;
}
buildObstacle();

function resetAll(){
  [ux,uy,ux0,uy0,pressure,divergence,curl,smoke,smoke0,dust,dust0,heat,heat0,fire,fire0].forEach(clearField);
  particles.length=0; waves.length=0; scars.length=0; blasts.length=0; speedLines.length=0;
  state.time=0; state.nextEvent=0; state.damage=0; state.active=false; state.flash=0; state.shake=0; state.freeze=0;
}
function startExplosion(){
  resetAll();
  state.active=true;
  state.time=0;
}

function sample(a,x,y){
  x=clamp(x,0.5,GW-1.5); y=clamp(y,0.5,GH-1.5);
  const x0=x|0,y0=y|0,x1=x0+1,y1=y0+1;
  const sx=x-x0,sy=y-y0;
  const i00=id(x0,y0),i10=id(x1,y0),i01=id(x0,y1),i11=id(x1,y1);
  const a0=a[i00]*(1-sx)+a[i10]*sx;
  const a1=a[i01]*(1-sx)+a[i11]*sx;
  return a0*(1-sy)+a1*sy;
}
function advect(dst,src,vx,vy,dt,diss){
  const decay=1/(1+diss*dt);
  for(let y=1;y<GH-1;y++){
    for(let x=1;x<GW-1;x++){
      const k=id(x,y);
      if(obstacle[k]){dst[k]=0; continue;}
      const bx=x-vx[k]*dt, by=y-vy[k]*dt;
      dst[k]=sample(src,bx,by)*decay;
    }
  }
}
function solidify(){
  for(let x=0;x<GW;x++){
    ux[id(x,0)]=0; uy[id(x,0)]=0; ux[id(x,GH-1)]=0; uy[id(x,GH-1)]=0;
  }
  for(let y=0;y<GH;y++){
    ux[id(0,y)]=0; uy[id(0,y)]=0; ux[id(GW-1,y)]=0; uy[id(GW-1,y)]=0;
  }
  for(let i=0;i<N;i++){
    if(obstacle[i]){
      ux[i]=0; uy[i]=0; smoke[i]*=0.15; dust[i]*=0.15; heat[i]=0; fire[i]=0;
    }
  }
}
function project(iter){
  pressure.fill(0);
  for(let y=1;y<GH-1;y++){
    for(let x=1;x<GW-1;x++){
      const k=id(x,y);
      if(obstacle[k]){divergence[k]=0; continue;}
      const l=isBlocked(x-1,y)?0:ux[id(x-1,y)];
      const r=isBlocked(x+1,y)?0:ux[id(x+1,y)];
      const b=isBlocked(x,y+1)?0:uy[id(x,y+1)];
      const t=isBlocked(x,y-1)?0:uy[id(x,y-1)];
      divergence[k]=-0.5*((r-l)+(b-t));
    }
  }
  for(let n=0;n<iter;n++){
    for(let y=1;y<GH-1;y++){
      for(let x=1;x<GW-1;x++){
        const k=id(x,y);
        if(obstacle[k]) continue;
        const pc=pressure[k];
        const l=isBlocked(x-1,y)?pc:pressure[id(x-1,y)];
        const r=isBlocked(x+1,y)?pc:pressure[id(x+1,y)];
        const b=isBlocked(x,y+1)?pc:pressure[id(x,y+1)];
        const t=isBlocked(x,y-1)?pc:pressure[id(x,y-1)];
        pressure[k]=(l+r+b+t+divergence[k])*0.25;
      }
    }
  }
  for(let y=1;y<GH-1;y++){
    for(let x=1;x<GW-1;x++){
      const k=id(x,y);
      if(obstacle[k]) continue;
      const pc=pressure[k];
      const l=isBlocked(x-1,y)?pc:pressure[id(x-1,y)];
      const r=isBlocked(x+1,y)?pc:pressure[id(x+1,y)];
      const b=isBlocked(x,y+1)?pc:pressure[id(x,y+1)];
      const t=isBlocked(x,y-1)?pc:pressure[id(x,y-1)];
      ux[k]-=0.5*(r-l);
      uy[k]-=0.5*(b-t);
    }
  }
  solidify();
}
function addVorticity(dt){
  for(let y=1;y<GH-1;y++){
    for(let x=1;x<GW-1;x++){
      const k=id(x,y);
      curl[k]=obstacle[k]?0:0.5*((uy[id(x+1,y)]-uy[id(x-1,y)])-(ux[id(x,y+1)]-ux[id(x,y-1)]));
    }
  }
  const eps=params.vort;
  for(let y=2;y<GH-2;y++){
    for(let x=2;x<GW-2;x++){
      const k=id(x,y);
      if(obstacle[k]) continue;
      let gx=Math.abs(curl[id(x+1,y)])-Math.abs(curl[id(x-1,y)]);
      let gy=Math.abs(curl[id(x,y+1)])-Math.abs(curl[id(x,y-1)]);
      const len=Math.hypot(gx,gy)+1e-5;
      gx/=len; gy/=len;
      const c=curl[k];
      ux[k]+=gy*c*eps*dt;
      uy[k]+=-gx*c*eps*dt;
    }
  }
}
function addBuoyancy(dt){
  for(let i=0;i<N;i++){
    if(obstacle[i]) continue;
    uy[i]-=(heat[i]*8.0-smoke[i]*0.12-dust[i]*0.05)*dt;
    ux[i]+=Math.sin(i*12.9898+state.time*2.1)*heat[i]*0.025*dt;
  }
}

function inject(cx,cy,power,kind,dir){
  const look=params.look;
  let fireMul=look==='fire'?1.45:look==='dust'?0.75:1.0;
  let dustMul=look==='dust'?1.6:look==='fire'?0.75:1.0;
  const smokeMul=params.smokeAmt*(kind==='smoke'?1.6:1.0);
  const rad=kind==='ground'?12:kind==='core'?13:9;
  const force=(28+power*34)*params.power;
  for(let y=Math.floor(cy-rad);y<=Math.ceil(cy+rad);y++){
    if(y<1||y>=GH-1) continue;
    for(let x=Math.floor(cx-rad);x<=Math.ceil(cx+rad);x++){
      if(x<1||x>=GW-1) continue;
      const k=id(x,y);
      if(obstacle[k]&&Math.hypot(x-cx,y-cy)>rad*0.55) continue;
      const dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy);
      if(d>rad) continue;
      const q=(1-d/rad);
      let nx=dx/(d+0.001),ny=dy/(d+0.001);
      if(dir<0){nx-=0.9; ny-=0.12;} else if(dir>0){nx+=0.9; ny-=0.12;} else {ny-=0.28;}
      const nl=Math.hypot(nx,ny)+0.001; nx/=nl; ny/=nl;
      ux[k]+=nx*force*q*q;
      uy[k]+=ny*force*q*q;
      fire[k]+=q*q*(kind==='dust'||kind==='smoke'?0.35:3.2*power)*fireMul;
      heat[k]+=q*q*(kind==='dust'?1.4:7.0*power);
      smoke[k]+=q*q*(kind==='fire'?1.0:2.4*power)*smokeMul;
      dust[k]+=q*q*(kind==='fire'?0.55:2.9*power)*dustMul*params.smokeAmt;
    }
  }
  const px=cx*S,py=cy*S;
  scars.push({x:px,y:py,r:26+rad*3,life:1,kind});
  waves.push({x:px,y:py,r:8,v:430+power*140,life:0.46,a:0.9});
  makeBlast(px,py,power,kind,dir);
  makeSpeedLines(px,py,power,dir);
  state.flash=Math.max(state.flash,kind==='core'?1.0:0.52);
  state.shake=Math.max(state.shake,kind==='core'?18:10);
  state.freeze=Math.max(state.freeze,kind==='core'?0.035:0);
  spawnParticles(px,py,force*2.6,kind,dir);
}
function makeBlast(x,y,power,kind,dir){
  const core=kind==='core';
  const side=dir!==0;
  const count=core?18:side?12:10;
  const base=core?86:kind==='ground'?74:58;
  for(let i=0;i<count;i++){
    const a=(Math.PI*2*i/count)+(Math.random()-0.5)*0.42+(side?(dir>0?0:Math.PI)*0.18:0);
    const stretch=side?1.45:1.0;
    const dist=(0.35+Math.random()*0.85)*base*power;
    const rx=Math.cos(a)*dist*stretch+(side?dir*38*power:0);
    const ry=Math.sin(a)*dist*(core?0.82:0.68)-Math.random()*24*power;
    const hot=i<count*0.55&&kind!=='smoke'&&kind!=='dust';
    blasts.push({
      x:x+rx,y:y+ry,ox:rx,oy:ry,r:(22+Math.random()*34)*power,
      vr:34+Math.random()*58,life:hot?0.95+Math.random()*0.35:1.45+Math.random()*0.65,
      max:hot?1.25:1.85,hot,seed:Math.random()*1000,kind
    });
  }
  blasts.push({x,y,ox:0,oy:0,r:core?92:64,vr:72,life:core?0.62:0.48,max:0.72,hot:true,seed:777+Math.random(),kind:'white'});
}
function makeSpeedLines(x,y,power,dir){
  const count=dir===0?26:18;
  for(let i=0;i<count;i++){
    const a=dir===0?Math.PI*2*i/count+(Math.random()-0.5)*0.18:(dir>0?0:Math.PI)+(Math.random()-0.5)*0.9;
    const len=90+Math.random()*210*power;
    const start=35+Math.random()*80;
    speedLines.push({x,y,a,start,len,life:0.24+Math.random()*0.16,max:0.32});
  }
}
function spawnParticles(x,y,force,kind,dir){
  const count=kind==='ground'?150:kind==='smoke'?72:120;
  for(let i=0;i<count;i++){
    const a=(dir<0?Math.PI:dir>0?0:-Math.PI/2)+(Math.random()-0.5)*(dir===0?Math.PI*1.5:Math.PI*0.85);
    const sp=(0.35+Math.random()*1.15)*force;
    const spark=kind!=='dust'&&Math.random()<0.58;
    particles.push({
      x,y,px:x,py:y,
      vx:Math.cos(a)*sp+(Math.random()-0.5)*80,
      vy:Math.sin(a)*sp-Math.random()*120,
      r:spark?1+Math.random()*1.5:2+Math.random()*4,
      life:spark?0.35+Math.random()*0.45:1.2+Math.random()*1.2,
      max:1,
      spark
    });
  }
  for(const p of particles) if(!p.max) p.max=p.life;
}
function runTimeline(dt){
  if(!state.active) return;
  state.time+=dt;
  while(state.nextEvent<events.length&&state.time>=events[state.nextEvent].t){
    const e=events[state.nextEvent++];
    inject(e.x,e.y,e.p,e.kind,e.dir);
    state.damage=Math.min(1,state.damage+0.15);
  }
  if(state.time>1.4&&state.time<5.8){
    const n=Math.sin(state.time*9.0)*0.5+0.5;
    if(Math.random()<0.34){
      const cx=90+n*14,cy=70+Math.sin(state.time*4)*12;
      inject(cx,cy,0.12,'smoke',0);
    }
  }
  if(state.time>7.5) state.active=false;
}
function addPointer(dt){
  if(!pointer.down) return;
  const x=pointer.x/S,y=pointer.y/S,px=pointer.px/S,py=pointer.py/S;
  const dx=(x-px)/Math.max(dt,1e-4),dy=(y-py)/Math.max(dt,1e-4);
  const rad=8;
  for(let yy=Math.floor(y-rad);yy<=Math.ceil(y+rad);yy++){
    if(yy<1||yy>=GH-1) continue;
    for(let xx=Math.floor(x-rad);xx<=Math.ceil(x+rad);xx++){
      if(xx<1||xx>=GW-1) continue;
      const k=id(xx,yy);
      if(obstacle[k]) continue;
      const d=Math.hypot(xx-x,yy-y);
      if(d>rad) continue;
      const q=1-d/rad;
      ux[k]+=dx*q*0.38; uy[k]+=dy*q*0.38;
      smoke[k]+=q*0.75; dust[k]+=q*0.25; heat[k]+=q*0.5; fire[k]+=q*0.25;
    }
  }
}
function stepFluid(dt){
  runTimeline(dt);
  addPointer(dt);
  addVorticity(dt);
  addBuoyancy(dt);
  project(14);
  copy(ux0,ux); copy(uy0,uy);
  advect(ux,ux0,ux0,uy0,dt,0.03);
  advect(uy,uy0,ux0,uy0,dt,0.03);
  project(14);
  copy(smoke0,smoke); copy(dust0,dust); copy(heat0,heat); copy(fire0,fire);
  advect(smoke,smoke0,ux,uy,dt,0.10);
  advect(dust,dust0,ux,uy,dt,0.16);
  advect(heat,heat0,ux,uy,dt,0.82);
  advect(fire,fire0,ux,uy,dt,2.6);
  solidify();
}

function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#09111f'); g.addColorStop(0.58,'#121923'); g.addColorStop(1,'#171419');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#162033';
  for(let i=0;i<24;i++){
    const x=(i*73)%W,h=90+((i*47)%150),w=28+((i*19)%38);
    ctx.fillRect(x,H-h,w,h);
    ctx.fillStyle='rgba(115,145,180,0.18)';
    for(let yy=H-h+12;yy<H-10;yy+=18) for(let xx=x+6;xx<x+w-6;xx+=12)
      if((xx+yy+i)%4===0) ctx.fillRect(xx,yy,4,7);
    ctx.fillStyle='#162033';
  }
  ctx.fillStyle='#080b11';
  ctx.fillRect(0,H-30,W,30);
}
function fireColor(t){
  t=Math.max(0,t);
  if(t>2.0) return [255,246,214];
  if(t>1.1) return [255,206,76];
  if(t>0.45) return [248,93,20];
  return [128,22,14];
}
function renderFluid(){
  const d=img.data;
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      const k=id(x,y),p=k*4;
      if(obstacle[k]){d[p+3]=0; continue;}
      const f=fire[k],s=smoke[k],du=dust[k];
      const band=Math.floor(Math.min(1,Math.max(s*0.07,du*0.08))*5)/5;
      const fc=fireColor(f);
      let r=24+band*72+du*18,g=28+band*76+du*14,b=34+band*82+du*6;
      if(du>s){r+=42; g+=31; b+=14;}
      const flame=Math.min(1,f*0.85);
      r=r*(1-flame)+fc[0]*flame;
      g=g*(1-flame)+fc[1]*flame;
      b=b*(1-flame)+fc[2]*flame;
      const edge=(s+du)>0.8&&((smoke[id(Math.max(0,x-1),y)]+dust[id(Math.max(0,x-1),y)])<0.25||
        (smoke[id(Math.min(GW-1,x+1),y)]+dust[id(Math.min(GW-1,x+1),y)])<0.25)?0.72:1;
      d[p]=Math.min(255,r*edge);
      d[p+1]=Math.min(255,g*edge);
      d[p+2]=Math.min(255,b*edge);
      d[p+3]=Math.min(235,(f*90+s*36+du*42));
    }
  }
  octx.putImageData(img,0,0);
  ctx.save();
  ctx.globalCompositeOperation='source-over';
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(off,0,0,W,H);
  ctx.restore();
}
function drawBuilding(){
  const bx=72*S,by=16*S,bw=59*S,bh=87*S;
  ctx.save();
  ctx.fillStyle='rgba(20,25,35,0.88)';
  ctx.fillRect(bx,21*S,49*S,80*S);
  ctx.fillStyle='rgba(28,34,46,0.92)';
  ctx.fillRect(84*S,16*S,25*S,9*S);
  ctx.fillRect(64*S,96*S,66*S,7*S);
  ctx.strokeStyle='#4b5568'; ctx.lineWidth=2;
  ctx.strokeRect(bx,21*S,49*S,80*S);
  ctx.strokeRect(84*S,16*S,25*S,9*S);
  ctx.fillStyle='rgba(102,135,165,0.5)';
  for(let y=28*S;y<92*S;y+=12*S){
    for(let x=78*S;x<116*S;x+=11*S){
      const hot=scars.some(s=>Math.abs(s.x-x)<32&&Math.abs(s.y-y)<32);
      ctx.fillStyle=hot?'rgba(255,107,28,0.64)':'rgba(99,132,158,0.42)';
      ctx.fillRect(x,y,5*S,6*S);
    }
  }
  for(const s of scars){
    const grd=ctx.createRadialGradient(s.x,s.y,2,s.x,s.y,s.r);
    grd.addColorStop(0,'rgba(8,8,10,0.95)');
    grd.addColorStop(0.58,'rgba(13,9,8,0.88)');
    grd.addColorStop(0.82,'rgba(210,60,18,0.45)');
    grd.addColorStop(1,'rgba(210,60,18,0)');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle='rgba(8,10,14,0.82)';
  ctx.lineWidth=2;
  const crackCount=Math.floor(12+state.damage*24);
  for(let i=0;i<crackCount;i++){
    const sx=bx+35+((i*41)%220),sy=by+58+((i*67)%360);
    ctx.beginPath();
    ctx.moveTo(sx,sy);
    ctx.lineTo(sx-16+((i*13)%32),sy+28+((i*7)%28));
    if(i%3===0) ctx.lineTo(sx+24,sy+56);
    ctx.stroke();
  }
  ctx.restore();
}
function updateParticles(dt){
  state.flash=Math.max(0,state.flash-dt*3.8);
  state.shake=Math.max(0,state.shake-dt*20);
  state.freeze=Math.max(0,state.freeze-dt);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.px=p.x; p.py=p.y;
    p.vy+=420*dt;
    p.vx*=1-0.45*dt; p.vy*=1-0.12*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.life-=dt;
    if(p.life<=0||p.y>H+40||p.x<-60||p.x>W+60) particles.splice(i,1);
  }
  for(let i=waves.length-1;i>=0;i--){
    const w=waves[i];
    w.r+=w.v*dt; w.life-=dt;
    if(w.life<=0) waves.splice(i,1);
  }
  for(let i=blasts.length-1;i>=0;i--){
    const b=blasts[i];
    b.r+=b.vr*dt;
    b.x+=b.ox*0.18*dt;
    b.y+=b.oy*0.13*dt-18*dt;
    b.life-=dt;
    if(b.life<=0) blasts.splice(i,1);
  }
  for(let i=speedLines.length-1;i>=0;i--){
    speedLines[i].life-=dt;
    if(speedLines[i].life<=0) speedLines.splice(i,1);
  }
}
function drawParticles(){
  ctx.save();
  for(const w of waves){
    ctx.strokeStyle=`rgba(255,245,210,${Math.max(0,w.life)*0.72})`;
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=`rgba(255,87,22,${Math.max(0,w.life)*0.34})`;
    ctx.lineWidth=8;
    ctx.beginPath(); ctx.arc(w.x,w.y,w.r*0.92,0,Math.PI*2); ctx.stroke();
  }
  ctx.lineCap='round';
  for(const p of particles){
    const a=Math.max(0,p.life/p.max);
    if(p.spark){
      ctx.strokeStyle=`rgba(255,205,91,${a})`;
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x,p.y); ctx.stroke();
    }else{
      ctx.fillStyle=`rgba(73,65,58,${0.35+0.45*a})`;
      ctx.fillRect(p.x-p.r*0.5,p.y-p.r*0.5,p.r,p.r);
    }
  }
  ctx.restore();
}
function blobPath(x,y,r,seed,amp=0.22,steps=22){
  ctx.beginPath();
  for(let i=0;i<steps;i++){
    const a=Math.PI*2*i/steps;
    const wobble=1+Math.sin(a*3.0+seed)*amp+Math.sin(a*7.0+seed*1.7)*amp*0.48;
    const rr=r*wobble;
    const px=x+Math.cos(a)*rr;
    const py=y+Math.sin(a)*rr*0.78;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}
function drawBlastClouds(){
  ctx.save();
  const ordered=[...blasts].sort((a,b)=>(a.hot===b.hot?0:a.hot?-1:1));
  for(const b of ordered){
    const age=1-b.life/b.max;
    const a=clamp(b.life/b.max,0,1);
    const outline=b.hot?'#170b08':'#08090d';
    blobPath(b.x,b.y,b.r,b.seed,0.24,24);
    ctx.fillStyle=outline;
    ctx.fill();
    const hot=b.hot&&age<0.72;
    let fill;
    if(b.kind==='white'&&age<0.45) fill='#fff8dd';
    else if(hot&&age<0.28) fill='#fff1a6';
    else if(hot&&age<0.55) fill='#ff8b25';
    else if(hot) fill='#9d2415';
    else fill=b.kind==='dust' || b.kind==='ground' ? '#6f6250' : '#181b22';
    blobPath(b.x,b.y,b.r*0.82,b.seed+12.5,0.20,22);
    ctx.fillStyle=fill;
    ctx.globalAlpha=hot?0.96:0.82*a;
    ctx.fill();
    if(hot&&age<0.62){
      blobPath(b.x-b.r*0.08,b.y-b.r*0.06,b.r*(0.36+0.12*Math.sin(b.seed)),b.seed+44,0.26,18);
      ctx.fillStyle=age<0.25?'#ffffff':'#ffd84f';
      ctx.globalAlpha=0.9*(1-age);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
function drawSpeedLines(){
  ctx.save();
  ctx.lineCap='butt';
  for(const l of speedLines){
    const a=clamp(l.life/l.max,0,1);
    const x0=l.x+Math.cos(l.a)*l.start;
    const y0=l.y+Math.sin(l.a)*l.start;
    const x1=l.x+Math.cos(l.a)*(l.start+l.len);
    const y1=l.y+Math.sin(l.a)*(l.start+l.len);
    ctx.strokeStyle=`rgba(255,245,220,${a*0.86})`;
    ctx.lineWidth=1+3*a;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  }
  ctx.restore();
}
function drawOverlays(){
  if(state.flash>0){
    ctx.save();
    ctx.globalCompositeOperation='screen';
    ctx.fillStyle=`rgba(255,245,218,${Math.min(0.82,state.flash*0.72)})`;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  if(state.flash>0.62){
    ctx.save();
    ctx.globalAlpha=(state.flash-0.62)*1.4;
    ctx.strokeStyle='#ffffff';
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.moveTo(W*0.5,0); ctx.lineTo(W*0.5,H);
    ctx.moveTo(0,H*0.52); ctx.lineTo(W,H*0.52);
    ctx.stroke();
    ctx.restore();
  }
  ctx.save();
  const v=Math.min(1,state.time/2.8);
  const grad=ctx.createRadialGradient(W*0.5,H*0.52,120,W*0.5,H*0.52,520);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,`rgba(0,0,0,${0.18+v*0.22})`);
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}
function draw(){
  ctx.save();
  if(state.shake>0){
    const s=state.shake;
    ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s);
  }
  drawBackground();
  drawBuilding();
  renderFluid();
  drawBlastClouds();
  drawSpeedLines();
  drawParticles();
  ctx.restore();
  drawOverlays();
}

function frame(now){
  let dt=Math.min(1/30,(now-state.last)/1000||1/60);
  state.last=now;
  if(!state.paused){
    const simDt=state.freeze>0?0:dt;
    stepFluid(simDt);
    updateParticles(dt);
  }
  draw();
  state.fps=state.fps*0.9+(1/dt)*0.1;
  document.getElementById('stats').textContent=`${state.fps.toFixed(0)} fps`;
  requestAnimationFrame(frame);
}

function setPointer(e){
  const r=cv.getBoundingClientRect();
  pointer.px=pointer.x; pointer.py=pointer.y;
  pointer.x=(e.clientX-r.left)*W/r.width;
  pointer.y=(e.clientY-r.top)*H/r.height;
}
cv.addEventListener('pointerdown',e=>{pointer.down=true; setPointer(e); cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(pointer.down) setPointer(e);});
cv.addEventListener('pointerup',e=>{pointer.down=false; cv.releasePointerCapture(e.pointerId);});
cv.addEventListener('pointercancel',()=>{pointer.down=false;});

document.getElementById('boom').addEventListener('click',startExplosion);
document.getElementById('reset').addEventListener('click',resetAll);
document.getElementById('pause').addEventListener('click',e=>{
  state.paused=!state.paused;
  e.currentTarget.textContent=state.paused?'再開':'一時停止';
});
document.getElementById('look').addEventListener('change',e=>{params.look=e.target.value;});
document.getElementById('power').addEventListener('input',e=>{params.power=+e.target.value;});
document.getElementById('smokeAmt').addEventListener('input',e=>{params.smokeAmt=+e.target.value;});
document.getElementById('vort').addEventListener('input',e=>{params.vort=+e.target.value;});

startExplosion();
requestAnimationFrame(frame);
</script>
</body>
</html>
